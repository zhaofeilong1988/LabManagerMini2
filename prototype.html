/* 证书类型：cert-detail TYPE_LABEL（1 安全证书 / 2 资质证书 / 3 培训证书） */
const CD_TYPE = { 1:'安全证书', 2:'资质证书', 3:'培训证书' };
/* 证书状态：cert-detail STATE_MAP（1 有效 / 0 已失效 / 2 审核中 / 3 已过期 / 4 已撤回） */
const CD_STATE = {
  1:{ text:'有效',   cls:'cd-st--valid' },
  0:{ text:'已失效', cls:'cd-st--invalid' },
  2:{ text:'审核中', cls:'cd-st--reviewing' },
  3:{ text:'已过期', cls:'cd-st--expired' },
  4:{ text:'已撤回', cls:'cd-st--invalid' }
};
/* 庄重日期呈现 YYYY.MM.DD（cert-detail fmtDateElegant） */
function cdElegant(ymd){ return ymd ? String(ymd).slice(0,10).replace(/-/g,'.') : ''; }
/* 剩余天数：仅「有效」且有失效日期时计算（cert-detail daysToExpiry） */
function cdDaysLeft(expireYmd, stateCls){
  if(!expireYmd || stateCls !== 'cd-st--valid') return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(String(expireYmd).slice(0,10) + 'T00:00:00');
  if(isNaN(target.getTime())) return 0;
  return Math.max(0, Math.floor((target.getTime() - today.getTime()) / 86400000));
}
function certHtml(){
  const p = params['cert'] || {};
  const c = CERTS.find(x=>x.id === Number(p.id)) || CERTS[0];
  const st = CD_STATE[c.state != null ? c.state : 1] || CD_STATE[1];
  const isLongTerm = !c.expireDate;
  const days = cdDaysLeft(c.expireDate, st.cls);
  return `
  ${navHtml(esc(c.name),'back()')}
  <div style="padding:12px 12px 0">
    <div class="cd-hero">
      <div class="cd-top">
        <span class="cd-badge cd-badge--${c.type}">${esc(CD_TYPE[c.certType] || '证书')}</span>
        <span class="cd-status ${st.cls}"><span>${st.cls==='cd-st--valid'?'✓':'!'}</span>${st.text}</span>
      </div>
      <div class="cd-medal">🏅</div>
      <span class="cd-name">${esc(c.name)}</span>
      <span class="cd-no" onclick="certCopyNo('${esc(c.no)}')">CERT NO. ${esc(c.no)} ⧉</span>
    </div>
    <div class="cd-card">
      <div class="cd-card-t"><span class="td-dot"></span><span class="cd-card-tt">有效期</span></div>
      <div class="cd-valid">
        <div class="cd-valid-cell">
          <span class="cd-valid-lab">发证日期</span>
          <span class="cd-valid-val">${esc(cdElegant(c.date))}</span>
        </div>
        <div class="cd-valid-sep"></div>
        <div class="cd-valid-cell">
          <span class="cd-valid-lab">有效期至</span>
          <span class="cd-valid-val">${isLongTerm ? '长期有效' : esc(cdElegant(c.expireDate))}</span>
        </div>
      </div>
      ${(!isLongTerm && st.cls==='cd-st--valid' && days > 0) ? `<div class="cd-valid-left">剩余 ${days} 天</div>` : ''}
    </div>
    <div class="cd-card">
      <div class="cd-card-t"><span class="td-dot"></span><span class="cd-card-tt">证书信息</span></div>
      <div class="info-row"><span class="k">持证人</span><span class="v">${esc(USER.name)}</span></div>
      <div class="info-row"><span class="k">颁发单位</span><span class="v">${esc(c.organizer)}</span></div>
      ${c.instrument?`<div class="info-row"><span class="k">关联设备</span><span class="v">${esc(c.instrument)}</span></div>`:''}
    </div>
    <div class="cd-card">
      <div class="cd-card-t"><span class="td-dot"></span><span class="cd-card-tt">证书简介</span></div>
      <span class="cd-desc">${esc(c.desc)}</span>
    </div>
    <div class="cd-bottom"></div>
  </div>`;
}
function certCopyNo(no){
  const txt = String(no || '');
  const ok = () => toast('已复制证书编号');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, ()=>certCopyLegacy(txt, ok));
  } else certCopyLegacy(txt, ok);
}
function certCopyLegacy(txt, ok){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); ok(); }catch(e){ toast('复制失败'); }
  document.body.removeChild(ta);
}

function admMove(nextState, meta){
  if(!admDetail) return;
  const it = admDetail;
  const st = ADM_STATUS[nextState] || ADM_STATUS[1];
  approval.pending = approval.pending.filter(x=>x.id !== it.id);

/* 按设备编号查找：支持数字 id / 固定资产编号 assetNo / SN / 所资产编号 */
function sd2Find(no){
  const key = String(no == null ? '' : no).trim();
  if(!key) return null;
  return INSTRUMENTS.find(i =>
    key === String(i.id) || key === i.assetNo || key === i.sn || key === i.instAssetNo
  ) || null;
}
/* 最近一次未取消预约的时段文案（本地 myBookings 兜底，与 utils/bookings.js 语义一致） */
function sd2LatestBook(instId){
  const hit = mbList()
    .filter(b => b.instId === Number(instId) && b.st !== 'cancelled')
    .sort((a, b) => (b.dateLabel + ' ' + (b.startText || '')).localeCompare(a.dateLabel + ' ' + (a.startText || '')))[0];
  if(!hit) return '';
  return (hit.dateLabel || '') + ' ' + (hit.startText || '') + ' - ' + (hit.endText || '');
}
/* 控制方式枚举（复刻 pages/scan-detail CONTROL_TYPE）：1 蓝牙电源 / 2 二维码 / 3 蓝牙锁 */
const SD2_CONTROL_TYPE_TEXT = { 1: '蓝牙电源', 2: '二维码', 3: '蓝牙锁' };
/* 演示数据的控制方式：FV3000=蓝牙电源(1) / CytoFLEX=二维码(2) / Tecnai=蓝牙锁(3)，
   与实际设备一一对应，便于在原型里演示蓝牙两次握手与「蓝牙锁关机为虚拟控制」两种路径 */
const SD2_CONTROL_TYPE = { 1: 1, 2: 2, 3: 3 };
/* 是否走蓝牙协议控制（复刻 onTogglePower + BLUETOOTH_CONTROL_TYPES = [1,3]） */
function sd2IsBtControl(it){ const t = SD2_CONTROL_TYPE[it.id]; return t === 1 || t === 3; }
/* 本次操作是否需要连蓝牙：蓝牙电源开/关都要；
   蓝牙锁仅开机连，关机为「虚拟控制」直接上报服务端（复刻参考项目 control_type=3 关机分支） */
function sd2NeedBle(it, turnOn){
  const t = SD2_CONTROL_TYPE[it.id];
  if(t === 3) return !!turnOn;
  return t === 1;
}
/* 模拟后端 /api/getDeviceDetail 返回体：字段路径与 pages/scan-detail 取值逻辑一致（data.admin_name / data.device.*） */
/* 设备开关机演示态（复刻 utils/device.js）：id=2 默认已开机，其余未开机；开关机后会话内保持 */
const SD2_POWER = {};
function sd2Power(it){
  if(!SD2_POWER[it.id]){
    SD2_POWER[it.id] = it.id === 2
      ? { poweredOn: true, powerOnTime: '2026-09-08 09:12:33' }
      : { poweredOn: false, powerOnTime: '' };
  }
  return SD2_POWER[it.id];
}
function sd2NowText(){
  const t = new Date(), p = n => (n < 10 ? '0' : '') + n;
  return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()) + ' ' + p(t.getHours()) + ':' + p(t.getMinutes());
}
function sd2MockBody(it){
  const pw = sd2Power(it);
  return {
    code: 0,
    message: 'success',
    data: {
      admin_name: String(it.manager || '').split(' · ')[0] || it.manager,
      admin_phone: it.contactPhone,
      device: {
        id: it.id,
        name: it.name,
        lab: it.lab,
        needBook: it.needBook,
        control: it.control,
        controlType: SD2_CONTROL_TYPE[it.id] != null ? SD2_CONTROL_TYPE[it.id] : 2,
        assetNo: it.assetNo,
        poweredOn: pw.poweredOn,
        powerOnTime: pw.powerOnTime,
        lastBookTime: sd2LatestBook(it.id)
      }
    }
  };
}
let sdetail = { it: null, deviceId: '', timer: 0, busy: false, msg: '', stepTimer: 0 };

/* 开机 / 关机：按钮文案随当前状态切换（复刻 pages/scan-detail onTogglePower）
   蓝牙控制类设备（蓝牙电源 / 蓝牙锁开机）流程：
     初始化蓝牙 → 搜索设备 → 建连 → 第一次握手 →【调 /api/deviceOperate 上报】
     → 上报成功 → 第二次握手 → 下发开关机指令
   非蓝牙设备 / 蓝牙锁关机：直接上报服务端 */
function sd2TogglePower(){
  const it = sdetail.it; if(!it || sdetail.busy) return;
  const st = sd2Power(it);
  const turnOn = !st.poweredOn;
  const done = () => {
    SD2_POWER[it.id] = { poweredOn: turnOn, powerOnTime: turnOn ? sd2NowText() : '' };
    sdetail.busy = false; sdetail.msg = '';
    sd2RenderOk();
    toast(turnOn ? '已开机' : '已关机');
  };
  if(sd2NeedBle(it, turnOn)){
    const steps = [
      '正在初始化蓝牙…',
      '正在搜索设备...',
      '正在连接设备…',
      '第一次握手成功，正在同步服务器…',
      '服务器已响应，继续第二次握手…',
      '第二次握手成功…',
      turnOn ? '设备已成功开启！' : '设备已成功关闭！'
    ];
    sdetail.busy = true; sdetail.msg = steps[0];
    sd2RenderOk();
    clearTimeout(sdetail.stepTimer);
    let i = 0;
    const tick = () => {
      i++;
      if(i < steps.length){
        sdetail.msg = steps[i];
        sd2RenderOk();
        sdetail.stepTimer = setTimeout(tick, 700);
        return;
      }
      done();
    };
    sdetail.stepTimer = setTimeout(tick, 700);
    return;
  }
  sdetail.busy = true; sdetail.msg = '';
  sd2RenderOk();
  toast(turnOn ? '正在开机…' : '正在关机…');
  clearTimeout(sdetail.stepTimer);
  sdetail.stepTimer = setTimeout(done, 500);
}
