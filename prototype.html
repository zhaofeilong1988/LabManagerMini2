<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>实验室管理小程序 · 高保真交互原型（严格复刻真实样式）</title>
<style>
/* ================================================================
   复刻自 LabManagerMini2 微信小程序真实 wxss（MD3 色彩系统）
   设计稿宽度 750rpx = 375px 手机屏，故本文件 1rpx = 0.5px
   主色 #0A7BB8 · 强调 #33ADDE · 渐变 linear-gradient(135deg,#0A7BB8,#33ADDE)
   ================================================================ */
:root{
  --pri:#0A7BB8; --acc:#33ADDE; --on:#fff;
  --bg:#F5FAFD; --bg2:#F0F4F8; --bg3:#f4f6f8; --card:#fff;
  --line:#E0EAF0; --line2:#F0F4F8;
  --txt:#0E1C26; --t2:#0E3A50; --sub:#3D5263; --sub2:#42474E; --hint:#8A9BB0; --hint2:#c8d0d8;
  --err:#BA1A1A; --errbg:#FDECEA; --ok:#0D86BE; --ok2:#0D86BE;
  --warn:#FFB300; --warn2:#E65100; --org:#FF9800; --org2:#FF8F00; --org3:#E65100;
  --bluebg:#C9E9FA; --greenbg:#E1F2FA; --orgbg:#FFF3E0; --redbg:#FFEBEE;
  --shadow:0 1px 6px rgba(0,0,0,.06);
  --grad:linear-gradient(135deg,#0A7BB8 0%,#33ADDE 100%);
  --grad-hero:linear-gradient(135deg,#0D86BE 0%,#33ADDE 60%,#74CFF2 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:#e8edf3; color:var(--txt);
  display:flex;align-items:center;justify-content:center;
  padding:20px;min-height:100vh;
}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;}
.stage-title{font-size:17px;font-weight:800;color:var(--pri);letter-spacing:.5px;}
.stage-sub{font-size:11px;color:var(--hint);max-width:580px;text-align:center;line-height:1.7;}
.stage-sub b{color:var(--acc);font-weight:600;}
/* ── 手机壳 ── */
.phone{
  position:relative;width:375px;height:800px;background:var(--bg);
  border-radius:44px;overflow:hidden;flex-shrink:0;
  box-shadow:0 24px 64px rgba(10,123,184,.28),0 0 0 10px #1b2733,0 0 0 12px #3a4b5c;
  display:flex;flex-direction:column;
}
@media (max-height:860px){.phone{height:720px;} .stage{padding:4px 0;} .stage-title,.stage-sub{display:none;}}
/* ── 状态栏 ── */
.statusbar{
  height:30px;flex-shrink:0;position:absolute;top:0;left:0;right:0;z-index:120;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;color:#fff;font-size:12px;font-weight:700;pointer-events:none;
  background:#0A7BB8; /* 原生导航栏 #0A7BB8 贯通状态栏区域 */
}
/* ── 导航栏（对应 navigationBarBackgroundColor #0A7BB8 / 白字） ── */
.nav{
  position:sticky;top:0;z-index:60;height:46px;flex-shrink:0;background:var(--pri);
  display:flex;align-items:center;
}
.nav .nb{width:46px;height:46px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;flex-shrink:0;}
.nav .nt{flex:1;color:#fff;font-size:17px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav .nb + .nt{padding-left:0;}
.nav .nt.pad-r{padding-right:46px;}
.nav .nav-r{padding-right:14px;color:#fff;font-size:11px;white-space:nowrap;}
/* ── 屏幕区 ── */
.screens{flex:1;position:relative;overflow:hidden;margin-top:30px;background:var(--bg);}
/* 屏内容区：滚动由 .screen 承担，隐藏滚动条（模拟手机，横线由 overflow-x 兜住） */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);display:none;-webkit-overflow-scrolling:touch;-ms-overflow-style:none;scrollbar-width:none;}
.screen::-webkit-scrollbar{width:0;height:0;display:none;}
.screen.active{display:block;}
.screen.bg2{background:var(--bg2);}
.screen.bg3{background:var(--bg3);}
/* ── 底部 Toolbar（复刻 pages/index/index.wxss） ── */
.toolbar{
  flex-shrink:0;display:flex;background:var(--card);
  /* 严格对齐 index.wxss：border-top 1rpx var(--md-outline-variant) #C2CAD0；阴影 0 -2rpx 12rpx rgba(0,0,0,.06) */
  border-top:1px solid #C2CAD0;box-shadow:0 -1px 6px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom);
}
.tb-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:5px 0 4px;cursor:pointer;position:relative;user-select:none;}
.tb-ind{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:2px;border-radius:1px;background:var(--acc);transition:width .25s;}
.tb-btn.active .tb-ind{width:24px;}
.tb-btn .tb-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#6E7F8A;margin:1px 0;}
.tb-btn .tb-ic svg{width:100%;height:100%;display:block;}
.tb-btn.active .tb-ic{color:var(--acc);}
/* 未选中标签色：var(--md-on-surface-variant) #41484D（toolbar-label 22rpx=11px / margin-top 4rpx=2px） */
.tb-btn .tb-tx{font-size:11px;color:#41484D;margin-top:2px;transition:color .2s;}
.tb-btn.active .tb-tx{color:var(--acc);font-weight:600;}
/* ==================== 通用组件（卡片/标签/按钮/徽章） ==================== */
.page{padding:12px;}
.page.no-pad{padding:0;}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500;white-space:nowrap;line-height:16px;}
.tag-blue{background:var(--bluebg);color:#0A7BB8;}
.tag-green{background:var(--greenbg);color:#0D86BE;}
.tag-orange{background:var(--orgbg);color:#FF9800;}
.tag-red{background:var(--errbg);color:var(--err);}
.tag-gray{background:#F0F4F8;color:var(--hint);}
.tag-plain-open{color:#33ADDE;}
.tag-plain-enrolled{color:#0D86BE;}
.tag-plain-full{color:#FF7043;}
.tag-plain-ended{color:var(--hint);}
.tag-plain{font-weight:500;padding:0;background:none;font-size:10px;}
/* Filled 主按钮（btn-filled 复刻） */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:20px;height:40px;font-size:14px;font-weight:500;cursor:pointer;user-select:none;transition:opacity .15s;}
.btn:active{opacity:.85;}
.btn-block{width:100%;}
.btn-main{background:var(--grad);color:#fff;}
.btn-sec{background:#fff;color:var(--pri);border:1px solid var(--line);}
.btn-plain{background:#fff;color:var(--acc);border:1px solid var(--acc);}
.btn-gray{background:#F0F4F8;color:var(--hint);}
.btn-danger{background:#fff;color:var(--err);border:1px solid var(--err);}
.btn-mini{height:24px;font-size:11px;padding:0 12px;border-radius:12px;font-weight:500;}
.btn[disabled]{opacity:1;}
/* 顶部细条/正文标题（对应 .section-title 等） */
.sec{margin:12px 12px 0;}
.sec-t{font-size:14px;font-weight:700;color:var(--txt);display:block;margin-bottom:8px;padding-left:2px;}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sec-more{font-size:12px;color:var(--acc);}
.arrow{color:var(--hint2);font-size:13px;flex-shrink:0;}
/* 行（label/value） */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line2);}
.info-row:last-child{border-bottom:none;}
.info-row .k{color:var(--hint);flex-shrink:0;margin-right:12px;}
.info-row .v{color:var(--txt);font-weight:600;text-align:right;flex:1;}
/* 进度条 */
.prog{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;}
.prog>i{display:block;height:100%;background:var(--grad);border-radius:2px;}
/* 浮层 */
.overlay{position:absolute;inset:0;z-index:180;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.dialog{width:300px;background:#fff;border-radius:28px;padding:24px 20px 20px;box-shadow:0 16px 40px rgba(14,28,38,.22);animation:pop .2s ease;}
@keyframes pop{from{transform:scale(.92);opacity:.4;}to{transform:scale(1);opacity:1;}}
.dialog .d-ic{width:56px;height:56px;margin:0 auto;border-radius:50%;background:var(--bluebg);display:flex;align-items:center;justify-content:center;color:var(--pri);font-size:26px;line-height:1;}
.dialog .d-ic svg{width:30px;height:30px;display:block;}
.dialog .d-t{font-size:17px;font-weight:600;text-align:center;color:var(--txt);padding:14px 0 0;}
.dialog .d-s{font-size:13px;color:var(--sub);text-align:center;line-height:1.6;padding:8px 0 0;}
.dialog .d-rows{margin-top:16px;background:var(--bg2);border-radius:12px;overflow:hidden;}
.dialog .d-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;border-bottom:1px solid #E7EEF3;}
.dialog .d-row:last-child{border-bottom:none;}
.dialog .d-row .k{color:var(--hint);}
.dialog .d-row .v{color:var(--txt);font-weight:600;}
.dialog .d-input{width:100%;margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;outline:none;background:var(--bg2);color:var(--txt);}
.dialog .d-input:focus{border-color:var(--acc);background:#fff;}
.dialog .d-fields{margin-top:16px;display:flex;flex-direction:column;gap:12px;}
/* 修改密码弹窗的「登录名」展示行（复刻 profile.wxml .pwd-account） */
.dialog .pwd-account{margin-top:14px;display:flex;flex-direction:row;align-items:center;gap:8px;padding:9px 12px;background:var(--bg2);border-radius:10px;}
.dialog .pwd-account-l{font-size:12px;color:var(--hint);flex-shrink:0;}
.dialog .pwd-account-v{font-size:13px;color:var(--txt);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dialog .d-field{display:flex;flex-direction:column;gap:6px;}
.dialog .d-fl{font-size:12px;color:var(--sub);font-weight:500;padding-left:2px;}
.dialog .d-fi{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;outline:none;background:var(--bg2);color:var(--txt);}
.dialog .d-fi:focus{border-color:var(--acc);background:#fff;}
.dialog .d-actions{display:flex;gap:10px;margin-top:22px;}
.dialog .d-abtn{flex:1;height:46px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;border-radius:23px;cursor:pointer;transition:opacity .15s;}
.dialog .d-abtn.cancel{background:#EEF4F8;color:var(--sub);font-weight:500;}
.dialog .d-abtn.confirm{background:var(--pri);color:#fff;}
.dialog .d-abtn.danger{background:var(--errbg);color:var(--err);}
.dialog .d-abtn.grad{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(10,123,184,.32);}
.dialog .d-abtn:active{opacity:.85;}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:200;background:#fff;border-radius:12px 12px 0 0;padding:6px 6px 10px;animation:up .22s ease;}
@keyframes up{from{transform:translateY(60%);}to{transform:translateY(0);}}
.sheet .sh-it{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;font-size:15px;border-radius:8px;cursor:pointer;}
.sheet .sh-it + .sh-it{margin-top:6px;}
.sheet .sh-cancel{color:var(--hint);}
.sheet .sh-blue{background:var(--bluebg);color:#0A7BB8;}
.sheet-cover{position:absolute;inset:0;z-index:195;background:rgba(0,0,0,.35);display:none;}
.sheet-cover.show{display:block;}
/* 底部弹层信息行（点击准入步骤节点查看各步骤进度/内容时使用，视觉对齐 .dialog .d-row） */
.sheet .d-row{display:flex;flex-direction:row;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 14px;font-size:13px;line-height:1.5;border-bottom:1px solid #F0F3F6;}
.sheet .d-row:last-of-type{border-bottom:none;}
.sheet .d-row .k{color:var(--hint);flex-shrink:0;}
.sheet .d-row .v{color:var(--txt);font-weight:600;text-align:right;flex:1;word-break:break-all;}
/* 节点弹层：已完成项（已填写 / 已上传 / 已通过）蓝色高亮，未完成项维持默认灰（小程序 node-row-val--accent） */
.sheet .d-row .v.accent{color:var(--pri);}
#toast{position:absolute;left:50%;top:44%;transform:translateX(-50%) scale(.9);z-index:260;background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:10px 18px;border-radius:8px;max-width:260px;text-align:center;line-height:1.5;opacity:0;pointer-events:none;transition:all .2s;}
#toast.show{opacity:1;transform:translateX(-50%) scale(1);}
.empty{text-align:center;color:var(--hint);font-size:12px;padding:22px 0;}
/* ==================== 首页（components/home/home） ==================== */
.hm{height:100%;background:var(--bg);}
.hm-scroll{height:100%;}
.hm-header{display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:24px 16px 12px;background:var(--grad);}
.hm-greet{font-size:18px;font-weight:700;color:#fff;display:block;}
.hm-sub{font-size:12px;color:rgba(255,255,255,.75);display:block;margin-top:3px;}
.hm-ava{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.5);flex-shrink:0;}
.hm-ava-t{font-size:16px;font-weight:700;color:#fff;}
.hm-notice{display:flex;align-items:center;gap:6px;height:40px;padding:0 16px;background:#C9E9FA;color:#06324A;font-size:13px;line-height:1.4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.hm-onb{display:flex;flex-direction:row;align-items:center;justify-content:space-between;margin:10px 12px 0;background:linear-gradient(135deg,#FFF8E1 0%,#FFF3CD 100%);border:1px solid var(--warn);border-radius:8px;padding:12px 14px;box-shadow:0 1px 6px rgba(255,179,0,.15);cursor:pointer;}
.hm-onb-l{display:flex;flex-direction:row;align-items:flex-start;gap:8px;flex:1;min-width:0;}
.hm-onb-ic{font-size:20px;flex-shrink:0;}
.hm-onb-t{font-size:14px;font-weight:700;color:#7A4F00;display:block;}
.hm-onb-s{font-size:12px;color:#A06800;display:block;margin-top:2px;}
.hm-onb-ar{font-size:14px;color:var(--warn);flex-shrink:0;margin-left:6px;}
.cgroup{background:var(--card);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);}
.cell{display:flex;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;background:#fff;cursor:pointer;}
.cell + .cell{border-top:1px solid var(--line2);}
.cell:active{background:#F6FAFD;}
.ci{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;color:#fff;}
.ci-pri{background:var(--pri);} .ci-err{background:var(--err);} .ci-sec{background:#4A6070;} .ci-ter{background:#574B6E;}
.cb{flex:1;min-width:0;}
.ct{font-size:14px;color:var(--txt);font-weight:500;line-height:1.35;}
.cs{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45;}
.cr{flex-shrink:0;display:flex;align-items:center;gap:8px;}
.vtag{font-size:12px;line-height:16px;padding:2px 6px;border-radius:2px;flex-shrink:0;color:#fff;display:inline-flex;align-items:center;}
.vtag-success{background:#07c160;}
.vtag-warning{background:#ff976a;}
.vtag-danger{background:#ee0a24;}
.vtag-primary{background:#33ADDE;}
.vtag-default{background:#969799;}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);}
.qit{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;cursor:pointer;}
.qit:active{background:#F6FAFD;}
.qic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
.qic svg{width:100%;height:100%;display:block;}
.qtx{font-size:12px;color:#646566;}
.prog-cell{margin-top:5px;width:100%;}
.prog-label{font-size:11px;color:var(--sub);margin-top:4px;}
.hm-bottom{height:16px;}

/* ── 首页严格同步：以下尺寸/颜色按 components/home/home.wxss 的 rpx 值 2:1 换算 ── */
/* Cell 左侧图标：72rpx×72rpx、圆角 18rpx、阴影 0 4rpx 12rpx rgba(0,0,0,.08) */
.hm .ci,.ci-duty,.ci-warn,.ci-appt,.ci-train{
  width:36px;height:36px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:15px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);
}
/* 值日图标（home.wxss .duty-icon）：#0D86BE → #33ADDE */
.ci-duty {background:linear-gradient(135deg,#0D86BE 0%,#33ADDE 100%);box-shadow:0 2px 6px rgba(13,134,190,.32);}
/* 值日表未设置警告（.error-icon）：橙 #FF6B35 → #FFA071（注意：不是 error 红） */
.ci-warn {background:linear-gradient(135deg,#FF6B35 0%,#FFA071 100%);box-shadow:0 2px 6px rgba(255,107,53,.32);}
/* 近期预约（.appt-icon）：紫 #7B68EE → #B19BFF */
.ci-appt {background:linear-gradient(135deg,#7B68EE 0%,#B19BFF 100%);box-shadow:0 2px 6px rgba(123,104,238,.32);}
/* 培训进度（.training-icon）：琥珀 #F59E0B → #FCD34D */
.ci-train{background:linear-gradient(135deg,#F59E0B 0%,#FCD34D 100%);box-shadow:0 2px 6px rgba(245,158,11,.32);}

/* 快捷入口：卡片内边距 12rpx 0 = 6px 0 */
.hm .qgrid{padding:6px 0;}
/* 点击反馈：scale(.92) + .18s（home.wxss .grid-item:active） */
.qit{transition:transform .18s ease;}
.qit:active{background:transparent;transform:scale(.92);}
/* 图标彩色光晕（home.wxss：filter drop-shadow(0 4rpx 8rpx …) = 0 2px 4px） */
.qit--scan    .qic svg{filter:drop-shadow(0 2px 4px rgba(13,134,190,.35));}
.qit--book    .qic svg{filter:drop-shadow(0 2px 4px rgba(123,104,238,.35));}
.qit--work    .qic svg{filter:drop-shadow(0 2px 4px rgba(20,184,166,.35));}
.qit--warn    .qic svg{filter:drop-shadow(0 2px 4px rgba(255,107,53,.40));}
.qit--train   .qic svg{filter:drop-shadow(0 2px 4px rgba(245,158,11,.40));}
.qit--approve .qic svg{filter:drop-shadow(0 2px 4px rgba(16,185,129,.35));}
.qit--mentor  .qic svg{filter:drop-shadow(0 2px 4px rgba(236,72,153,.35));}
.qit--duty    .qic svg{filter:drop-shadow(0 2px 4px rgba(99,102,241,.35));}
/* 无审批权限：去掉光晕，文字走 #B0BEC5（home.wxss .grid-item--disabled / .grid-text--disabled） */
.qit--disabled .qic svg{filter:none;}
.qtx--disabled{color:#B0BEC5;}

/* 文本色：对齐 Vant 默认 + MD 主题覆盖（--md-on-surface #161C20 / --md-on-surface-variant #41484D） */
.hm .ct{color:#323233;}          /* van-cell title 默认色 */
.hm .cs{color:#41484D;}          /* --van-cell-label-color: var(--md-on-surface-variant) */
.hm .sec-t{color:#161C20;}       /* .section-title: var(--md-on-surface) */
.hm .prog-label{color:#41484D;}  /* .progress-label: var(--md-on-surface-variant) */
/* 培训进度条：轨道 --md-surface-variant #DCE5EA，进度 --md-primary #0A7BB8（纯色，非渐变） */
.hm .prog{background:#DCE5EA;}
.hm .prog>i{background:#0A7BB8;}

/* ── 近期预约：骨架屏（home.wxss .appt-skeleton，1.4s shimmer）── */
.appt-skeleton{background:#fff;border-radius:8px;padding:4px 0;box-shadow:var(--shadow);overflow:hidden;}
.appt-skel-item{display:flex;flex-direction:row;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.04);}
.appt-skel-item:last-child{border-bottom:none;}
.appt-skel-icon{width:32px;height:32px;border-radius:8px;margin-right:10px;flex-shrink:0;
  background:linear-gradient(90deg,#ECEEF0 0%,#F4F5F7 50%,#ECEEF0 100%);background-size:200% 100%;
  animation:skel-shimmer 1.4s ease-in-out infinite;}
.appt-skel-body{flex:1;display:flex;flex-direction:column;gap:7px;}
.appt-skel-line{height:11px;border-radius:4px;background:linear-gradient(90deg,#ECEEF0 0%,#F4F5F7 50%,#ECEEF0 100%);
  background-size:200% 100%;animation:skel-shimmer 1.4s ease-in-out infinite;}
.appt-skel-line--lg{width:50%;height:14px;}
.appt-skel-line--sm{width:75%;}
@keyframes skel-shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ── 近期预约：空态 / 错误态（home.wxss .appt-empty）── */
.appt-empty{background:#fff;border-radius:8px;padding:28px 16px 24px;display:flex;flex-direction:column;
  align-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden;}
/* 极淡几何圆装饰 */
.appt-empty::before{content:'';position:absolute;top:-60px;right:-60px;width:140px;height:140px;border-radius:50%;
  background:linear-gradient(135deg,rgba(51,173,222,.08) 0%,rgba(10,123,184,.04) 100%);pointer-events:none;}
.appt-empty::after{content:'';position:absolute;bottom:-40px;left:-40px;width:100px;height:100px;border-radius:50%;
  background:linear-gradient(135deg,rgba(51,173,222,.06) 0%,rgba(10,123,184,.02) 100%);pointer-events:none;}
.appt-empty-illust{position:relative;width:72px;height:72px;display:flex;align-items:center;justify-content:center;
  margin-bottom:12px;background:linear-gradient(135deg,#E1F2FA 0%,#F5FAFD 100%);border-radius:50%;z-index:1;}
.appt-empty-emoji{font-size:36px;line-height:1;}
.appt-empty-deco{position:absolute;border-radius:50%;}
.appt-empty-deco--1{width:6px;height:6px;top:9px;right:7px;background:#33ADDE;opacity:.6;}
.appt-empty-deco--2{width:4px;height:4px;bottom:11px;left:9px;background:#FFC857;opacity:.7;}
.appt-empty-deco--3{width:5px;height:5px;top:15px;left:-2px;background:#FFB300;opacity:.55;}
.appt-empty-title{font-size:15px;font-weight:700;color:#161C20;margin-bottom:6px;text-align:center;z-index:1;}
.appt-empty-sub{font-size:12px;color:#41484D;text-align:center;margin-bottom:16px;line-height:1.5;z-index:1;}
.appt-empty-cta{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;
  padding:7px 18px;background:linear-gradient(135deg,#0A7BB8 0%,#33ADDE 100%);color:#fff;font-size:13px;font-weight:600;
  border-radius:999px;box-shadow:0 3px 9px rgba(10,123,184,.28);z-index:1;cursor:pointer;
  transition:transform .15s ease;}
.appt-empty-cta:active{transform:scale(.96);opacity:.92;}
.appt-empty-cta-arrow{font-size:15px;margin-left:4px;font-weight:400;line-height:1;}
/* 错误态：仅插画换成 ⚠️，其余同空态 */
.appt-empty--err .appt-empty-illust{background:linear-gradient(135deg,#FDECEA 0%,#FFF6F5 100%);}

/* ── 今日待办（2026-10-29 同步：home 由写死值日卡片改为 GET /api/todo/list 接口渲染）──
   图标渐变严格对齐 home.wxss .todo-icon--*（rpx 值 2:1 换算为 px） */
.todo-icon--daily-sign    {background:linear-gradient(135deg,#F59E0B 0%,#FBBF24 100%);box-shadow:0 3px 8px rgba(251,191,36,.24),inset 0 .5px 0 rgba(255,255,255,.45);}
.todo-icon--duty          {background:linear-gradient(135deg,#EA8C00 0%,#FCD34D 100%);box-shadow:0 3px 8px rgba(252,211,77,.24),inset 0 .5px 0 rgba(255,255,255,.45);}
.todo-icon--device-audit  {background:linear-gradient(135deg,#FB7185 0%,#FDBA74 100%);box-shadow:0 3px 8px rgba(251,113,133,.21),inset 0 .5px 0 rgba(255,255,255,.45);}
.todo-icon--device-booking{background:linear-gradient(135deg,#0EA5E9 0%,#38BDF8 100%);box-shadow:0 3px 8px rgba(56,189,248,.23),inset 0 .5px 0 rgba(255,255,255,.45);}
.todo-icon--access-audit  {background:linear-gradient(135deg,#14B8A6 0%,#5EEAD4 100%);box-shadow:0 3px 8px rgba(45,212,191,.21),inset 0 .5px 0 rgba(255,255,255,.45);}
.todo-icon--repair        {background:linear-gradient(135deg,#F43F5E 0%,#FCA5A5 100%);box-shadow:0 3px 8px rgba(244,63,94,.20),inset 0 .5px 0 rgba(255,255,255,.42);}
.todo-icon--training      {background:linear-gradient(135deg,#F59E0B 0%,#FDE68A 100%);box-shadow:0 3px 8px rgba(245,158,11,.21),inset 0 .5px 0 rgba(255,255,255,.45);}
.todo-icon--other         {background:linear-gradient(135deg,#EAB308 0%,#FDE047 100%);box-shadow:0 3px 8px rgba(250,204,21,.23),inset 0 .5px 0 rgba(255,255,255,.45);}
/* 待办图标：van-icon size 20px = 20px，白色线性描边 */
.todo-row .ci svg{width:20px;height:20px;display:block;}

/* 待处理数红点（home.wxss .todo-dot）：=1 小点 / >1 大点带数量；整体略微上移 8rpx = 4px */
.todo-dot{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  margin-left:5px;width:8px;height:8px;border-radius:50%;background:#F5222D;
  box-shadow:0 0 0 2px rgba(245,34,45,.16);transform:translateY(-4px);}
.todo-dot--num{width:15px;height:15px;box-shadow:0 0 0 2px rgba(245,34,45,.16),0 1px 3px rgba(245,34,45,.28);}
.todo-dot-num{color:#fff;font-size:9px;font-weight:700;line-height:1;}

/* 今日待办：空态 / 错误态（home.wxss .todo-empty，比近期预约空态小一圈） */
.todo-empty{background:#fff;border-radius:8px;padding:16px 16px 14px;display:flex;flex-direction:column;
  align-items:center;box-shadow:var(--shadow);}
.todo-empty--err{cursor:pointer;}
.todo-empty-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#E6F7F0 0%,#F4FBF8 100%);color:#10B981;font-size:16px;font-weight:700;line-height:1;
  box-shadow:0 2px 6px rgba(16,185,129,.16),inset 0 .5px 0 rgba(255,255,255,.6);}
.todo-empty-title{margin-top:4px;font-size:13px;font-weight:600;color:#2F3A45;letter-spacing:1px;}
.todo-empty-sub{margin-top:2px;font-size:11px;color:#9AA6AE;letter-spacing:.5px;}
.todo-empty--err .todo-empty-icon{background:linear-gradient(135deg,#FFF1E6 0%,#FFF9F4 100%);color:#FF6B35;
  box-shadow:0 2px 6px rgba(255,107,53,.16),inset 0 .5px 0 rgba(255,255,255,.6);}

/* 今日待办：加载骨架（home.wxss .todo-skeleton，1.4s shimmer） */
.todo-skeleton{background:#fff;border-radius:8px;padding:4px 0;box-shadow:var(--shadow);overflow:hidden;}
.todo-skel-item{display:flex;flex-direction:row;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.04);}
.todo-skel-item:last-child{border-bottom:none;}
.todo-skel-icon{width:36px;height:36px;border-radius:9px;margin-right:10px;flex-shrink:0;
  background:linear-gradient(90deg,#ECEEF0 0%,#F4F5F7 50%,#ECEEF0 100%);background-size:200% 100%;
  animation:skel-shimmer 1.4s ease-in-out infinite;}
.todo-skel-body{flex:1;display:flex;flex-direction:column;gap:7px;}
.todo-skel-line{height:11px;border-radius:4px;background:linear-gradient(90deg,#ECEEF0 0%,#F4F5F7 50%,#ECEEF0 100%);
  background-size:200% 100%;animation:skel-shimmer 1.4s ease-in-out infinite;}
.todo-skel-line--lg{width:50%;height:14px;}
.todo-skel-line--sm{width:75%;}
/* ==================== 仪器（components/instrument） ==================== */
.ins-page{height:100%;background:var(--bg);}
.ins-search{padding:8px 12px 4px;}
.ins-search-box{display:flex;align-items:center;gap:8px;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:8px 12px;overflow:hidden;}
.ins-search-box span{font-size:13px;color:var(--hint);}
.ins-search-box input{flex:1;border:none;outline:none;font-size:13px;background:transparent;color:var(--txt);height:22px;}
.ins-list{padding:4px 12px 0;}
/* ── v2 竖版大卡（复刻 components/instrument/instrument.wxss：名称 → 中图+标记+预约 → 实验室/平台） ── */
.ins-card{background:#fff;border-radius:10px;padding:12px 12px 10px;margin-bottom:12px;box-shadow:0 2px 10px rgba(10,123,184,.06);cursor:pointer;}
.ins-card:active{opacity:.95;}
.ins-hd{display:flex;flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:9px;}
.ins-name{flex:1;min-width:0;font-size:16px;font-weight:600;color:#0A7BB8;line-height:1.35;}
.ins-mid{display:flex;flex-direction:row;align-items:center;gap:11px;margin-bottom:9px;}
.ins-thumb{width:148px;height:82px;border-radius:8px;background:linear-gradient(135deg,#DBEFF9,#C9E9FA);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex-shrink:0;}
.ins-thumb-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;line-height:1;z-index:0;}
.ins-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;}
.ins-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px;}
.ins-flag{display:flex;flex-direction:row;align-items:center;gap:4px;}
/* 标记图标：需预约 橙 / 无需审批 绿 / 需审批 红（复刻 instrument.wxss --book / --ok / --warn） */
.ins-flag-ic{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;line-height:1;flex-shrink:0;}
.ins-flag-ic--book{background:linear-gradient(135deg,#FF6B35 0%,#FFA071 100%);box-shadow:0 1px 3px rgba(255,107,53,.3);}
.ins-flag-ic--ok{background:linear-gradient(135deg,#10B981 0%,#6EE7B7 100%);box-shadow:0 1px 3px rgba(16,185,129,.3);}
.ins-flag-ic--warn{background:linear-gradient(135deg,#FF4757 0%,#FF7A85 100%);box-shadow:0 1px 3px rgba(255,71,87,.3);}
/* 悬浮「回到顶部」（复刻 instrument.wxss .ins-back-top：滚动超 200px 显示） */
.ins-back-top{position:absolute;right:14px;bottom:24px;width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#FFFFFF 0%,#E1F2FA 100%);box-shadow:0 4px 12px rgba(10,123,184,.18);
  border:1px solid rgba(51,173,222,.25);display:none;align-items:center;justify-content:center;
  z-index:10;color:#0A7BB8;font-size:18px;font-weight:700;cursor:pointer;user-select:none;}
.ins-back-top:active{transform:scale(.92);opacity:.88;}
.ins-flag-t{font-size:12.5px;color:#0E1C26;line-height:1.3;white-space:nowrap;}
.ins-status{display:flex;flex-direction:row;align-items:center;gap:4px;}
.ins-status-ic{font-size:13px;color:#0A7BB8;line-height:1;}
.ins-status-t{font-size:12.5px;color:#0E1C26;line-height:1.3;white-space:nowrap;}
.ins-book{flex-shrink:0;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;height:32px;padding:0 12px;border-radius:16px;background:linear-gradient(135deg,#33ADDE,#0A7BB8);box-shadow:0 3px 8px rgba(10,123,184,.28);color:#fff;font-size:12.5px;font-weight:500;cursor:pointer;user-select:none;line-height:1;}
.ins-book:active{transform:scale(.94);}
.ins-foot{display:flex;flex-direction:row;justify-content:space-between;align-items:center;border-top:1px solid #F0F4F8;padding-top:6px;}
.ins-foot-l,.ins-foot-r{flex:1;min-width:0;font-size:11px;color:#6B7C8A;line-height:1.4;}
.ins-foot-l{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;}
.ins-foot-r{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ins-empty{padding:30px 0;text-align:center;color:var(--hint2);font-size:12px;}
.ins-bottom{height:16px;}
/* ==================== 仪器详情（pages/instrument-detail） ==================== */
.id-swiper{position:relative;margin:12px 12px 0;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#DBEFF9,#C9E9FA);height:200px;}
.id-track{display:flex;height:100%;transition:transform .35s ease;}
.id-slide{position:relative;min-width:100%;height:100%;}
.id-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;}
.id-slide-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;}
.id-dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px;z-index:2;}
.id-dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);cursor:pointer;transition:all .2s;}
.id-dots i.on{width:16px;background:#fff;}
.id-nav{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;cursor:pointer;line-height:1;}
.id-nav--l{left:8px;} .id-nav--r{right:8px;}
.id-card{background:#fff;border-radius:10px;margin:12px 12px 0;padding:14px;box-shadow:var(--shadow);}
.id-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.id-name{font-size:17px;font-weight:700;color:var(--txt);line-height:1.4;}
.id-tag{flex-shrink:0;font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;white-space:nowrap;}
.id-tag--idle{background:#E1F2FA;color:#0D86BE;}
.id-tag--online{background:#DBEFF9;color:#0D86BE;}
.id-meta{display:block;font-size:12px;color:#3D5263;margin-top:5px;line-height:1.5;}
.id-card-t{display:flex;align-items:center;gap:5px;margin-bottom:10px;}
.id-card-tt{font-size:15px;font-weight:700;color:var(--t2);}
.id-count{margin-left:auto;font-size:11px;color:var(--hint);}
.fee-table{border-radius:8px;overflow:hidden;border:1px solid #E6EEF4;background:#fff;}
.fee-row{display:flex;align-items:center;}
.fee-row + .fee-row{border-top:1px solid #E6EEF4;}
.fee-row--head{background:#EAF4FB;font-weight:600;color:var(--sub);}
.fee-row--head .fee-cell{padding:7px 0;font-size:11px;}
.fee-cell{flex:1;text-align:center;padding:9px 0;font-size:13px;color:var(--txt);}
.fee-cell + .fee-cell{border-left:1px solid #E6EEF4;}
.fee-cell--cat{flex:1.1;background:#EFF6FB;color:#566B78;font-size:12px;font-weight:500;text-align:left;padding-left:14px;}
.fee-row--head .fee-cell--cat{background:transparent;}
.fee-cell--self{color:var(--acc);font-weight:600;}
.id-tip{margin-top:8px;font-size:11px;color:var(--hint2);line-height:1.6;}
.id-ai-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #F0F3F6;}
.id-ai-row:last-child{border-bottom:none;}
.id-ai-k{font-size:12px;color:var(--hint);flex-shrink:0;}
.id-ai-v{font-size:12px;color:var(--t2);font-weight:500;text-align:right;word-break:break-all;}
.id-cta{position:sticky;bottom:0;z-index:40;margin-top:14px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);box-shadow:0 -2px 10px rgba(0,0,0,.06);}
.id-btn{height:40px;border-radius:20px;background:var(--grad);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(10,123,184,.3);}
.id-btn:active{opacity:.88;}
.id-bottom{height:16px;}
/* 「使用记录与费用」入口卡（pages/instrument-detail/index.wxml .id-link-card） */
.id-link-card{display:flex;flex-direction:row;align-items:center;gap:8px;cursor:pointer;}
.id-link-card:active{background:#F5F9FC;}
.id-link-card .id-card-tt{flex:1;min-width:0;}
.id-link-arrow{font-size:18px;color:#C2CAD0;line-height:1;}
/* ==================== 设备使用记录与费用（pages/device-log） ==================== */
.dl-page{min-height:100%;background:var(--bg2);padding:12px 12px 20px;}
.dl-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:56px 0;}
.dl-spin{width:22px;height:22px;border-radius:50%;border:2px solid #C9E9FA;border-top-color:var(--pri);animation:bd-spin .8s linear infinite;}
.dl-state-t{font-size:13px;color:var(--hint);}
.dl-err-ic{font-size:28px;}
.dl-state-btn{margin-top:2px;height:30px;padding:0 16px;border-radius:15px;background:var(--grad);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.dl-state-btn:active{opacity:.88;}
.dl-list{display:flex;flex-direction:column;gap:10px;}
.dl-item{background:#fff;border-radius:8px;padding:12px 14px;box-shadow:var(--shadow);}
.dl-item-hd{margin-bottom:8px;}
.dl-status{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.dl-status--ok{background:#E8F5E9;color:#2E7D32;}
.dl-status--warn{background:#FFF3E0;color:#FF9800;}
.dl-status--err{background:#FFEBEE;color:#C62828;}
.dl-status--off{background:#EEF2F6;color:#8A9BB0;}
.dl-kv{display:flex;flex-direction:row;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #F0F3F6;}
.dl-kv:last-child{border-bottom:none;}
.dl-k{font-size:12px;color:var(--hint);flex-shrink:0;}
.dl-v{font-size:12px;color:var(--t2);font-weight:500;text-align:right;word-break:break-all;}
.dl-v.dl-time{font-variant-numeric:tabular-nums;}
.dl-dept{font-size:11px;padding:1px 7px;border-radius:9px;}
.dl-dept--in{background:#E1F2FA;color:#0D86BE;}
.dl-dept--out{background:#FFF3E0;color:#FF9800;}
.dl-dept--off{background:#EEF2F6;color:#8A9BB0;}
.dl-item-ft{display:flex;flex-direction:row;align-items:center;justify-content:space-between;margin-top:8px;padding-top:9px;border-top:1px dashed #E3EAF0;}
.dl-ft-l{font-size:12px;color:var(--hint);}
.dl-ft-fee{font-size:15px;font-weight:700;color:var(--err);}
.dl-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:60px 0;}
.dl-empty-ic{font-size:40px;}
.dl-empty-t{font-size:13px;color:var(--hint);}
/* ==================== 培训（components/training） ==================== */
.tp-page{height:100%;background:var(--bg2);}
.tp-scroll{padding:12px 12px 0;height:100%;}
.m-ov{background:var(--grad);border-radius:10px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;}
.m-ov::before{content:'';position:absolute;right:-20px;top:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08);}
.m-ov-t{font-size:17px;font-weight:700;color:#fff;}
.m-ov-s{font-size:11px;color:rgba(255,255,255,.75);margin-top:3px;}
.m-ov-stats{margin-top:12px;display:flex;flex-direction:row;background:rgba(255,255,255,.14);border-radius:8px;padding:11px 0;}
.ov-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;border-right:1px solid rgba(255,255,255,.18);}
.ov-item:last-child{border-right:none;}
.ov-item-n{font-size:22px;font-weight:800;color:#fff;line-height:1;}
.ov-item-l{font-size:11px;color:rgba(255,255,255,.85);}
.s-hd{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px;}
.s-hd-l{display:flex;align-items:center;gap:5px;}
.s-dot{width:4px;height:16px;background:var(--acc);border-radius:2px;}
.s-title{font-size:15px;font-weight:600;color:var(--t2);}
.s-badge{background:var(--acc);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;}
.cert-scroll{width:100%;margin-bottom:12px;overflow-x:auto;display:flex;gap:8px;padding-bottom:4px;}
.cert-scroll::-webkit-scrollbar{display:none;}
.cert-card{width:110px;background:#fff;border-radius:8px;padding:12px 10px;box-shadow:var(--shadow);position:relative;flex-shrink:0;cursor:pointer;}
.cc-ic{margin-bottom:6px;}
.cc-ic em{font-style:normal;color:var(--acc);font-size:20px;font-weight:700;}
.cc-n{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cc-d{font-size:11px;color:var(--hint);}
.cc-bd{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 6px;border-radius:10px;background:var(--bluebg);color:var(--acc);}
.cc-bd.sp{background:var(--orgbg);color:var(--org2);}
.ecert{text-align:center;color:var(--hint);font-size:12px;padding:12px 0 16px;}
.ftabs{display:flex;gap:0;background:#E8EEF4;border-radius:10px;padding:2px;}
.ftab{font-size:11px;padding:3px 10px;border-radius:8px;color:var(--hint);cursor:pointer;transition:all .2s;}
.ftab.on{background:#fff;color:var(--acc);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.tr-list{display:flex;flex-direction:column;gap:8px;}
.tr-card{background:#fff;border-radius:8px;padding:14px;box-shadow:var(--shadow);cursor:pointer;}
.tr-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.tr-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
.tr-tag--safety{background:#E1F2FA;color:#0D86BE;}
.tr-tag--special{background:#DBEFF9;color:#0D86BE;}
.tr-tag--plan{background:#FFF3E0;color:#E65100;}
.tr-title{font-size:15px;font-weight:600;color:var(--t2);margin-bottom:5px;}
.tr-inst{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--hint);margin-bottom:8px;}
.tr-meta{display:flex;gap:12px;margin-bottom:8px;}
.meta-it{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--hint);}
.tr-foot{display:flex;align-items:center;gap:8px;}
.cap{flex:1;height:3px;background:#EEF2F6;border-radius:2px;overflow:hidden;}
.cap>i{display:block;height:100%;background:linear-gradient(90deg,#33ADDE,#0A7BB8);border-radius:2px;}
.btn-enroll{flex-shrink:0;height:24px;padding:0 12px;border-radius:12px;background:var(--acc);color:#fff;font-size:11px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.btn-enroll--plain{background:#fff;color:var(--acc);border:1px solid var(--acc);}
.st-full{font-size:11px;color:#FF7043;flex-shrink:0;font-weight:500;}
.st-ended{font-size:11px;color:var(--hint);flex-shrink:0;}
.tp-bottom{height:16px;}
/* ==================== 我的（components/profile） ==================== */
.pr-page{background:var(--bg3);height:100%;}
.pr-header{background:var(--grad);padding:30px 16px 20px;}
.pr-hd-c{display:flex;flex-direction:row;align-items:center;gap:12px;}
/* 头像：112rpx×112rpx 圆形 + 姓名首字（48rpx/600/白）；复刻 profile.wxss .avatar-wrap / .avatar-text */
.pr-ava{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pr-ava-t{font-size:24px;font-weight:600;color:#fff;line-height:1;}
.pr-info{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;}
.pr-name-row{display:flex;flex-direction:row;align-items:center;gap:6px;}
.pr-n{font-size:19px;font-weight:700;color:#fff;}
/* 角色标签与姓名同行（.user-role-tag：高 32rpx / 圆角 16rpx / 白 22rpx 半透明底） */
.pr-role{display:inline-flex;align-items:center;height:16px;padding:0 7px;border-radius:8px;background:rgba(255,255,255,.22);color:#fff;font-size:10px;line-height:1;font-weight:500;flex-shrink:0;}
/* 登录名 / 手机号（.user-meta：列排 gap 6rpx；label 固定宽 96rpx 半透明白，value 24rpx 白） */
.pr-meta{display:flex;flex-direction:column;gap:3px;margin-top:2px;}
.pr-meta-item{display:flex;flex-direction:row;align-items:center;min-width:0;line-height:1.3;}
.pr-meta-l{flex:0 0 48px;width:48px;font-size:11px;color:rgba(255,255,255,.65);}
/* 四字标签（账户余额）：48px 放不下四个字 */
.pr-meta-l--w4{flex:0 0 60px;width:60px;}
/* 余额睁眼 / 闭眼切换（默认闭眼） */
.pr-eye{flex-shrink:0;margin-left:4px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);cursor:pointer;user-select:none;}
.pr-eye:active{opacity:.7;}
.pr-eye-ic{display:flex;align-items:center;justify-content:center;line-height:0;}
.pr-meta-v{flex:1;min-width:0;font-size:12px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
/* 准入徽章（profile.wxss .badge-tag：20rpx / padding 4rpx 14rpx / 圆角 20rpx）
   reviewing #FFF3E0 + #FF9800；passed #E8F5E9 + #4CAF50 */
.pr-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;flex-shrink:0;}
.pr-badge--reviewing{background:#FFF3E0;color:#FF9800;}
.pr-badge--passed{background:#E8F5E9;color:#4CAF50;}
.pr-scroll{padding-bottom:20px;}
.pr-prog{margin:0 12px;margin-top:-10px;background:#fff;border-radius:8px;padding:14px;box-shadow:var(--shadow);}
.pr-rows{margin:0 12px;}
.pr-hd-row{display:flex;flex-direction:row;justify-content:space-between;align-items:center;margin-bottom:12px;}
.pr-t{font-size:14px;font-weight:600;color:#222;}
.pr-link{font-size:12px;color:var(--acc);}
.pr-steps{display:flex;flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:12px;}
.pstep{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;}
.psc{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}
.psc.done{background:var(--acc);color:#fff;}
.psc.active{background:#fff;border:1.5px solid #FF9800;color:#FF9800;}
.psc.gray{background:#fff;border:1.5px solid #ccc;color:#bbb;}
.psl{font-size:10px;color:#bbb;}
.psl.done{color:var(--acc);}
.psl.active{color:#FF9800;font-weight:600;}
.p-line{flex:1;height:1.5px;background:#ddd;margin-bottom:16px;}
.p-line.done{background:var(--acc);}
.p-line.active{background:#FF9800;}
/* 状态行：小程序 .progress-status-row 最终生效的是白底 + 圆角 16rpx + 浅阴影（前面的 #FFF8E1 被覆盖） */
.pr-status{display:flex;flex-direction:row;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.pr-st-l{display:flex;flex-direction:row;align-items:center;gap:5px;flex:1;min-width:0;}
/* 状态圆点：未完成 orange-dot #FF9800 / 已完成 green-dot #4CAF50 */
.pr-dot{width:7px;height:7px;border-radius:50%;background:#FF9800;flex-shrink:0;}
.pr-dot--green{background:#4CAF50;}
.pr-st-t{font-size:11px;color:#555;}
.pr-st-b{display:flex;align-items:center;justify-content:center;box-sizing:border-box;height:26px;padding:0 14px;margin:0;border:none;border-radius:13px;background:var(--acc);box-shadow:0 1px 4px rgba(51,173,222,.35);color:#fff;font-size:11px;font-weight:500;line-height:1;white-space:nowrap;flex-shrink:0;cursor:pointer;}
.gl{font-size:12px;color:#999;padding:12px 16px 6px;font-weight:500;}
.mcard{background:#fff;border-radius:8px;margin:0 12px 0;overflow:hidden;box-shadow:var(--shadow);}
.mi{display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:14px;cursor:pointer;}
.mi.disabled{opacity:.6;}
.mi-l{display:flex;flex-direction:row;align-items:center;gap:10px;flex:1;min-width:0;}
/* 菜单图标：22px 单色矢量（小程序 van-icon size="22px"），颜色由行内 style 指定 */
.mi-ic{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:22px;height:22px;}
.mi-ic svg{width:22px;height:22px;display:block;}
.mi-tx{display:flex;flex-direction:column;gap:2px;min-width:0;}
.mi-t{font-size:15px;color:#222;font-weight:500;}
.mi-t.dis{color:#888;}
.mi-s{font-size:11px;color:#999;}
.mi-r{display:flex;flex-direction:row;align-items:center;gap:5px;}
/* 箭头：小程序 van-icon color="#ccc" */
.mi .arrow{color:#ccc;}
.btag{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;background:#FFF3E0;color:#FF9800;}
.m-div{height:1px;background:#f2f2f2;margin:0 14px;}
.pr-entry{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:5px;margin:16px 12px 0;padding:12px;background:#fff;border-radius:8px;box-shadow:var(--shadow);cursor:pointer;font-size:14px;color:var(--pri);font-weight:500;}
.pr-entry--danger{color:var(--err);}
.pr-ph{font-size:11px;color:rgba(255,255,255,.8);margin-top:3px;}
.pr-bottom{height:20px;}
/* ==================== 登录页（复刻 pages/login/index 手机号授权登录） ==================== */
.lg-page{height:100%;background:var(--bg);}
.lg-wrap{min-height:100%;display:flex;flex-direction:column;}
.lg-hero{background:var(--grad-hero);padding:36px 24px 42px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;align-items:center;}
.lg-logo{width:74px;height:74px;border-radius:19px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(10,123,184,.35);}
.lg-logo svg{width:52px;height:52px;display:block;color:#fff;}
.lg-title{font-size:22px;font-weight:600;color:#fff;letter-spacing:1px;margin-top:16px;}
.lg-sub{font-size:13px;color:rgba(255,255,255,.88);margin-top:7px;text-align:center;line-height:1.6;}
.lg-body{padding:28px 24px 0;display:flex;flex-direction:column;}
.lg-tips{display:flex;flex-direction:row;align-items:center;gap:10px;background:var(--bluebg);border-radius:10px;padding:12px 14px;}
.lg-tips-ic{flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.lg-tips-ic svg{width:17px;height:17px;display:block;color:var(--pri);}
.lg-tips-text{flex:1;color:#06324A;font-size:13px;line-height:1.5;}
.lg-agree{display:flex;flex-direction:row;align-items:center;margin-top:20px;}
.lg-chk{width:18px;height:18px;border-radius:5px;border:1.5px solid #71797E;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;line-height:1;box-sizing:border-box;cursor:pointer;user-select:none;margin-right:8px;}
.lg-chk.on{background:var(--pri);border-color:var(--pri);}
.lg-agree-text{font-size:12px;color:#41484D;line-height:1.5;flex:1;cursor:pointer;user-select:none;}
.lg-link{color:var(--pri);}
.lg-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:48px;padding:0 20px;border-radius:24px;background:var(--grad);color:#fff;font-size:16px;font-weight:600;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(10,123,184,.32);margin-top:24px;border:none;user-select:none;}
.lg-btn-ic{display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lg-btn-ic svg{width:17px;height:17px;display:block;color:#fff;}
.lg-btn:active{opacity:.88;}
/* 禁用态：未勾选协议 / 登录中（对齐 login.wxss .login-btn[disabled]：浅蓝底、白字 92%、无阴影） */
.lg-btn.is-disabled{background:#C9E9FA;color:rgba(255,255,255,.92);box-shadow:none;}
.lg-btn.is-disabled:active{opacity:1;}
.lg-demo{margin-top:20px;text-align:center;font-size:13px;color:#4C6673;cursor:pointer;user-select:none;padding:4px 0;}
.lg-demo:active{opacity:.7;}
.lg-foot{margin-top:auto;padding:24px 24px 28px;text-align:center;font-size:11px;color:#71797E;}
/* ==================== 准入总览（onboarding/index） ==================== */
.ob-bg{background:var(--bg);}
.ob-header{background:var(--grad);padding:30px 16px 20px;}
.ob-h-t{font-size:20px;font-weight:700;color:#fff;display:block;}
.ob-h-s{font-size:13px;color:rgba(255,255,255,.8);display:block;margin-top:4px;}
.ob-steps{display:flex;flex-direction:row;align-items:flex-start;justify-content:center;background:#fff;padding:16px 8px 12px;box-shadow:var(--shadow);}
.ob-step{display:flex;flex-direction:column;align-items:center;position:relative;flex:1;cursor:pointer;}
.sl{position:absolute;top:11px;right:50%;left:-50%;height:1.5px;background:var(--line);z-index:0;}
.sl.done{background:var(--acc);}
.sc{width:22px;height:22px;border-radius:50%;background:#EEF2F6;display:flex;align-items:center;justify-content:center;z-index:1;position:relative;border:1px solid transparent;}
.ob-step.done .sc{background:var(--ok);}
.ob-step.active .sc{background:var(--acc);box-shadow:0 0 0 3px rgba(51,173,222,.2);}
.sn{font-size:11px;font-weight:700;color:#fff;}
.ob-step.pending .sn{color:var(--hint);}
.ob-step.pending .sc{background:var(--bg);border:1px solid var(--line);}
.slb{font-size:10px;margin-top:4px;color:var(--hint);text-align:center;white-space:nowrap;}
.ob-step.active .slb{color:var(--acc);font-weight:600;}
.ob-step.done .slb{color:var(--ok);}
.ob-step-hint{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;padding:8px 12px 0;}
.ob-step-hint-text{font-size:11px;color:var(--hint);}
.ob-card{margin:12px;background:#fff;border-radius:10px;padding:20px 16px;box-shadow:0 1px 8px rgba(0,0,0,.07);}
.ob-card-icon{font-size:32px;text-align:center;display:block;margin-bottom:8px;}
.ob-card-title{font-size:17px;font-weight:700;color:var(--txt);display:block;text-align:center;margin-bottom:6px;}
.ob-card-desc{font-size:13px;color:var(--sub);display:block;text-align:center;line-height:1.7;margin-bottom:14px;}
.ob-checklist{background:#F0F7FF;border-radius:6px;padding:10px 12px;}
.cl-item{display:flex;flex-direction:row;align-items:center;gap:6px;padding:5px 0;font-size:13px;color:var(--txt);border-bottom:1px solid var(--line);}
.cl-item:last-child{border-bottom:none;}
.cl-item .ok{color:var(--acc);font-weight:700;}
.cl-item .opt{color:var(--hint);}
.ob-task-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.ob-task{display:flex;flex-direction:row;align-items:center;gap:10px;background:#F0F7FF;border:1px solid var(--line);border-radius:8px;padding:12px;transition:all .2s;cursor:pointer;}
.ob-task.done{background:#E2F3FB;border-color:#A0D8F2;}
.ob-task-ic{width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid #B3E0FB;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--acc);font-size:15px;}
.ob-task-ic.done{background:var(--ok);border-color:var(--ok);color:#fff;}
.ob-task-m{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.ob-task-t{font-size:15px;font-weight:600;color:var(--txt);}
.ob-task.done .ob-task-t{color:var(--ok);}
.ob-task-s{font-size:11px;color:var(--hint);line-height:1.4;}
.ob-task.done .ob-task-s{color:var(--ok);}
.ob-sub-hint{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--warn);line-height:1.5;text-align:center;padding:0 8px;}
.ob-pending{background:#FFF8E1;border-radius:6px;padding:10px 12px;}
.ob-withdraw{text-align:center;margin-top:10px;font-size:13px;color:var(--err);padding:8px;cursor:pointer;}
.demo-entry{display:flex;flex-direction:row;align-items:center;justify-content:space-between;margin:0 12px 12px;background:#fff;border-radius:8px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;}
.demo-entry-text{font-size:12px;color:var(--sub);}
.ob-footer{padding:0 12px 24px;}
/* ==================== 登记表（onboarding/register） ==================== */
.ob-wrap{min-height:100%;background:var(--bg);}
.identity-tabs{display:flex;flex-direction:row;background:#fff;border-radius:8px;padding:4px;box-shadow:var(--shadow);margin:12px 12px 0;}
.identity-tab{flex:1;text-align:center;padding:10px 0;font-size:14px;color:var(--hint);border-radius:6px;transition:all .2s;cursor:pointer;}
.identity-tab.active{background:var(--grad);color:#fff;font-weight:700;}
.fs{margin:12px 12px 0;}
.fs-t{font-size:12px;font-weight:700;color:var(--hint);letter-spacing:1px;display:block;margin-bottom:6px;padding-left:2px;}
.fcard{background:#fff;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);}
.field{display:flex;flex-direction:row;align-items:center;padding:12px 14px;position:relative;border-bottom:1px solid var(--line2);}
.field:last-child{border-bottom:none;}
.field--col{flex-direction:column;align-items:stretch;}
.f-label{width:84px;flex-shrink:0;font-size:14px;color:var(--txt);}
.f-req{color:var(--err);margin-right:2px;}
/* 选填项占位星号：不可见但保留星号槽位，使整列字段名称左对齐（与小程序 register 一致） */
.f-req--ghost{visibility:hidden;}
.f-input{flex:1;font-size:14px;color:var(--txt);border:none;outline:none;background:transparent;line-height:1.6;}
.f-input::placeholder{color:var(--hint2);}
.field--col .f-input,.f-ta{width:100%;min-height:60px;margin-top:8px;}
.f-wrap{flex:1;display:flex;flex-direction:row;align-items:center;}
.f-wrap .f-input{flex:1;width:0;}
.link-btn{font-size:12px;color:var(--acc);padding:0 4px;font-weight:600;cursor:pointer;}
.declare-check{display:flex;flex-direction:row;align-items:flex-start;gap:8px;cursor:pointer;}
.checkbox{width:18px;height:18px;border-radius:4px;border:1.5px solid #C0C9D2;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;margin-top:1px;box-sizing:border-box;}
.checkbox.checked{background:var(--acc);border-color:var(--acc);}
.declare-text{font-size:12px;color:var(--sub);line-height:1.6;flex:1;}
.fhint{font-size:10px;color:var(--hint);margin-top:4px;}
/* ==================== 上传（onboarding/upload） ==================== */
.upload-tip{margin:12px;display:flex;flex-direction:row;align-items:center;gap:6px;background:#C9E9FA;color:var(--pri);font-size:12px;padding:8px 12px;border-radius:6px;}
.upload-tip-text{flex:1;line-height:1.5;}
.upload-tpl{margin:0 12px 12px;background:#fff;border-radius:8px;padding:14px;box-shadow:var(--shadow);}
.upload-tpl-title-row{display:flex;flex-direction:row;align-items:center;gap:5px;}
.upload-tpl-title{font-size:14px;font-weight:700;color:var(--txt);}
.upload-tpl-sub{display:block;font-size:11px;color:var(--hint);line-height:1.5;margin-top:4px;}
.upload-tpl-item{display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:9px 0;cursor:pointer;}
.upload-tpl-item + .upload-tpl-item{border-top:1px solid var(--line);}
.upload-tpl-file{display:flex;flex-direction:row;align-items:center;gap:8px;flex:1;min-width:0;}
.upload-tpl-ic{width:32px;height:32px;border-radius:6px;background:#F0F7FF;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.upload-tpl-meta{display:flex;flex-direction:column;gap:2px;min-width:0;}
.upload-tpl-name{font-size:13px;font-weight:500;color:var(--txt);}
.upload-tpl-fmt{font-size:10px;color:var(--hint);}
.upload-tpl-btn{display:flex;flex-direction:row;align-items:center;gap:4px;background:var(--grad);color:#fff;font-size:11px;padding:6px 12px;border-radius:14px;flex-shrink:0;}
.upload-doc{margin:0 12px 10px;background:#fff;border-radius:8px;padding:12px;box-shadow:var(--shadow);}
.upload-doc-hd{display:flex;flex-direction:row;align-items:center;gap:8px;margin-bottom:10px;}
.upload-doc-ic{width:32px;height:32px;border-radius:7px;background:#EAF4FD;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--acc);font-size:16px;}
.upload-doc-m{flex:1;min-width:0;}
.upload-doc-nr{display:flex;flex-direction:row;align-items:center;gap:6px;}
.upload-doc-n{font-size:14px;font-weight:600;color:var(--txt);}
.upload-doc-req{font-size:10px;color:var(--err);background:#FDECEA;padding:2px 6px;border-radius:10px;flex-shrink:0;}
.upload-doc-opt{font-size:10px;color:var(--hint);background:#F0F4F8;padding:2px 6px;border-radius:10px;flex-shrink:0;}
.upload-doc-d{display:block;font-size:11px;color:var(--hint);line-height:1.5;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.upload-doc-cnt{font-size:10px;font-weight:600;color:var(--hint);background:#F0F4F8;padding:3px 7px;border-radius:10px;flex-shrink:0;}
.upload-doc-cnt.has{color:var(--ok);background:#E2F3FB;}
.upload-photos{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;}
.upload-ph{width:72px;height:72px;border-radius:6px;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 1px 4px rgba(14,28,38,.1);display:flex;align-items:center;justify-content:center;font-size:24px;}
.upload-ph-del{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:rgba(14,28,38,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;cursor:pointer;border:1px solid rgba(255,255,255,.9);}
.upload-add{width:72px;height:72px;border-radius:6px;border:1px dashed var(--acc);background:#F5FAFE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;}
.upload-add .plus{color:var(--acc);font-size:20px;line-height:1;}
.upload-add-t{font-size:10px;color:var(--acc);}
/* ==================== 培训详情（pages/training/detail） ==================== */
.td-hero{background:var(--grad);border-radius:10px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;}
.td-hero::before{content:'';position:absolute;right:-25px;top:-25px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);}
.td-hd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative;z-index:1;}
.td-hd-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;background:rgba(255,255,255,.92);}
.td-hd-tag--safety{color:#0D86BE;} .td-hd-tag--special{color:#0A7BB8;} .td-hd-tag--plan{color:#E65100;}
.td-hd-status{font-size:11px;color:rgba(255,255,255,.92);background:rgba(0,0,0,.14);padding:2px 8px;border-radius:10px;}
.td-hd-title{display:block;font-size:19px;font-weight:700;color:#fff;margin-bottom:6px;position:relative;z-index:1;}
.td-hd-inst{display:block;font-size:12px;color:rgba(255,255,255,.78);margin-bottom:10px;position:relative;z-index:1;}
.td-hd-meta{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
.td-hd-meta-item{font-size:11px;color:rgba(255,255,255,.9);}
.td-adm-banner{display:flex;align-items:flex-start;gap:6px;background:#E1F5FE;border:1px solid #81D4FA;border-radius:8px;padding:10px 12px;margin-bottom:12px;}
.td-adm-banner span{font-size:12px;line-height:1.6;color:#01579B;flex:1;}
.td-card{background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.td-card-t{display:flex;align-items:center;margin-bottom:10px;}
.td-dot{width:4px;height:14px;background:linear-gradient(180deg,#33ADDE,#0A7BB8);border-radius:2px;margin-right:6px;}
.td-card-tt{font-size:15px;font-weight:600;color:var(--t2);}
.td-count{margin-left:auto;font-size:11px;color:var(--hint);}
.td-desc{display:block;font-size:13px;line-height:1.7;color:var(--sub);}
.td-doc{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer;}
.td-doc:last-child{border-bottom:none;}
.td-doc-ic{width:30px;height:30px;border-radius:6px;background:#E8F0F6;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:8px;font-size:14px;color:var(--pri);}
.td-doc-b{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.td-doc-n{font-size:13px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.td-doc-s{font-size:10px;color:var(--hint);}
.td-learned{flex-shrink:0;font-size:10px;padding:1px 7px;border-radius:10px;background:#E1F2FA;color:#0D86BE;font-weight:500;}
.td-video{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer;}
.td-video:last-child{border-bottom:none;}
.td-video-play{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#33ADDE,#0A7BB8);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:8px;color:#fff;font-size:12px;}
.td-video-play.done{background:#0D86BE;}
.td-video-b{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.td-video-n{font-size:13px;color:var(--t2);}
.td-video-d{font-size:10px;color:var(--hint);}
.td-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;color:var(--hint);font-size:12px;}
.td-exam-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F5F8FA;}
.td-exam-row-l{font-size:12px;color:var(--hint);flex-shrink:0;margin-right:12px;}
.td-exam-row-v{font-size:13px;color:var(--t2);font-weight:500;text-align:right;}
.td-exam-note{margin-top:8px;font-size:12px;line-height:1.6;color:#6E8090;background:#F4F8FB;border-radius:6px;padding:8px 10px;}
.td-exam-rec{margin-top:8px;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);background:#E1F2FA;border-radius:6px;padding:7px 10px;}
.td-cta{margin-top:16px;}
.td-btn-main{width:100%;height:42px;line-height:42px;border-radius:21px;border:none;background:linear-gradient(135deg,#33ADDE,#0A7BB8);color:#fff;font-size:15px;font-weight:600;padding:0;text-align:center;display:block;cursor:pointer;}
.td-btn-main:disabled,.td-btn-main.dis{background:#C3CBD3;color:rgba(255,255,255,.92);}
.td-cta-hint{display:block;margin-top:8px;text-align:center;font-size:12px;color:var(--warn2);}
.td-bottom{height:16px;}
/* ==================== 在线考试（onboarding/exam） ==================== */
.ex-wrap{height:100%;background:var(--bg);display:flex;flex-direction:column;}
.ex-header{background:var(--grad);padding:20px 16px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;}
.ex-title{font-size:17px;font-weight:700;color:#fff;}
.ex-timer{background:rgba(255,255,255,.2);border-radius:10px;padding:4px 10px;font-size:14px;color:#fff;font-weight:700;}
.ex-timer.warning{background:rgba(255,59,48,.7);}
.ex-prog-bar{background:var(--line);height:4px;}
.ex-prog-fill{height:4px;background:var(--acc);transition:width .3s;}
.q-card{margin:12px 12px 6px;background:#fff;border-radius:8px;padding:16px;box-shadow:var(--shadow);}
.q-meta{display:flex;flex-direction:row;align-items:center;gap:6px;margin-bottom:8px;}
.qtype-tag{font-size:10px;padding:2px 7px;border-radius:6px;background:#F3E8FF;color:#7C3AED;}
.qscore{font-size:11px;color:var(--hint);}
.q-text{font-size:15px;color:var(--txt);line-height:1.7;display:block;margin-bottom:14px;}
.opt{display:flex;flex-direction:row;align-items:center;gap:8px;padding:10px;border-radius:6px;margin-bottom:6px;border:1px solid var(--line);background:var(--bg);transition:all .2s;cursor:pointer;}
.opt.selected{border-color:var(--acc);background:#E3F4FD;}
.opt-c{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:var(--hint);font-weight:700;background:#fff;}
.opt.selected .opt-c{background:var(--acc);border-color:var(--acc);color:#fff;}
.opt-t{font-size:14px;color:var(--txt);flex:1;line-height:1.5;}
.ex-nav{display:flex;flex-direction:row;gap:10px;padding:0 12px 24px;}
.ex-nav .btn{flex:1;}
/* ==================== 准入成功 / 结果页 ==================== */
.rz{background:var(--bg);padding:40px 16px 24px;display:flex;flex-direction:column;align-items:center;}
.rz-ic{font-size:60px;margin-bottom:12px;}
.rz-t{font-size:20px;font-weight:700;color:var(--txt);display:block;margin-bottom:6px;}
.rz-s{font-size:14px;color:var(--sub);text-align:center;line-height:1.7;display:block;margin-bottom:20px;}
.rz-card{width:100%;background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 8px rgba(0,0,0,.07);margin-bottom:20px;}
.rz-footer{width:100%;padding:0 0 16px;}
/* ==================== 证书详情（pages/training/cert-detail） ==================== */
.cd-hero{background:var(--grad);border-radius:10px;padding:14px 16px 18px;margin-bottom:12px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;}
.cd-hero::before{content:'';position:absolute;right:-25px;top:-25px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);}
.cd-hero::after{content:'';position:absolute;left:-30px;bottom:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06);}
.cd-top{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative;z-index:1;}
.cd-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600;background:rgba(255,255,255,.92);}
.cd-badge--basic{color:#0D86BE;} .cd-badge--special{color:#0A7BB8;}
.cd-status{display:flex;align-items:center;gap:3px;font-size:11px;color:rgba(255,255,255,.92);background:rgba(0,0,0,.14);padding:3px 9px;border-radius:10px;}
.cd-medal{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;margin:4px 0 8px;position:relative;z-index:1;font-size:26px;}
.cd-name{font-size:19px;font-weight:700;color:#fff;position:relative;z-index:1;}
.cd-no{margin-top:6px;font-size:11px;color:rgba(255,255,255,.78);letter-spacing:1px;position:relative;z-index:1;cursor:pointer;}
.cd-no:active{opacity:.6;}
/* 状态徽章：cert-detail STATE_MAP（valid / invalid / reviewing / expired） */
.cd-status.cd-st--valid{background:rgba(255,255,255,.22);color:#fff;}
.cd-status.cd-st--invalid{background:rgba(0,0,0,.22);color:#FFD9D9;}
.cd-status.cd-st--reviewing{background:rgba(0,0,0,.18);color:#FFF3CD;}
.cd-status.cd-st--expired{background:rgba(0,0,0,.18);color:#FFE0B2;}
/* 有效期对开（发证日期 / 有效期至） */
.cd-valid{display:flex;flex-direction:row;align-items:center;}
.cd-valid-cell{flex:1;display:flex;flex-direction:column;gap:4px;}
.cd-valid-sep{width:1px;height:34px;margin:0 12px;background:linear-gradient(180deg,transparent 0%,var(--line) 50%,transparent 100%);}
.cd-valid-lab{font-size:11px;color:var(--hint);}
.cd-valid-val{font-size:16px;font-weight:700;color:var(--t2);letter-spacing:.5px;}
.cd-valid-left{margin-top:8px;text-align:center;font-size:11px;color:var(--pri);}
/* ==================== 我的证书（pages/my-certificates） ==================== */
.mc-list{padding:12px;}
.mc-card{background:#fff;border-radius:8px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;}
.mc-card:active{opacity:.8;}
.mc-hd{display:flex;flex-direction:row;align-items:center;gap:9px;}
.mc-ic{width:34px;height:34px;border-radius:8px;background:#E1F2FA;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.mc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.mc-n{font-size:14px;font-weight:600;color:var(--txt);}
.mc-sub{font-size:11px;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mc-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:9px;flex-shrink:0;}
.mc-tag.cd-st--valid{background:#E1F2FA;color:#0D86BE;}
.mc-tag.cd-st--invalid{background:var(--errbg);color:var(--err);}
.mc-tag.cd-st--reviewing{background:#FFF3E0;color:var(--warn2);}
.mc-tag.cd-st--expired{background:#FFF3E0;color:var(--warn2);}
.mc-rows{margin-top:10px;border-top:1px solid var(--line2);padding-top:8px;}
.mc-row{display:flex;flex-direction:row;gap:10px;padding:3px 0;}
.mc-row .k{width:74px;flex-shrink:0;font-size:11px;color:var(--hint);}
.mc-row .v{flex:1;min-width:0;font-size:11px;color:var(--txt);word-break:break-all;}
.mc-empty{text-align:center;color:var(--hint);font-size:12px;padding:70px 0;}
.mc-empty-ic{font-size:34px;display:block;margin-bottom:8px;}
.mc-bottom{height:16px;}
.cd-card{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.cd-card-t{display:flex;align-items:center;gap:5px;margin-bottom:10px;}
.cd-card-tt{font-size:15px;font-weight:600;color:var(--t2);}
.cd-desc{font-size:13px;line-height:1.7;color:var(--sub2);}
.cd-bottom{height:12px;}
/* ==================== 准入审批（pages/approval） ==================== */
.ap-wrap{background:var(--bg);padding-bottom:24px;}
.ap-tabs{display:flex;flex-direction:row;gap:8px;padding:12px;}
.ap-tab{flex:1;text-align:center;padding:10px 0;font-size:13px;color:var(--hint);background:#fff;border-radius:16px;box-shadow:var(--shadow);cursor:pointer;}
.ap-tab.active{background:var(--grad);color:#fff;font-weight:600;}
.ap-card{margin:0 12px 10px;background:#fff;border-radius:10px;padding:14px;box-shadow:var(--shadow);cursor:pointer;}
.ap-hd{display:flex;flex-direction:row;justify-content:space-between;align-items:center;margin-bottom:6px;}
.ap-name{font-size:15px;font-weight:600;color:var(--txt);}
.ap-type{display:block;font-size:12px;color:var(--hint);margin-bottom:3px;}
.ap-meta{display:block;font-size:12px;color:var(--hint);line-height:1.6;}
.ap-back{display:flex;flex-direction:row;align-items:center;gap:4px;padding:12px 16px 4px;font-size:13px;color:var(--pri);cursor:pointer;}
.ap-dcard{margin:8px 12px;background:#fff;border-radius:10px;padding:16px;box-shadow:var(--shadow);}
.detail-title{display:block;font-size:12px;font-weight:700;color:var(--hint);margin-bottom:8px;letter-spacing:1px;}
.mat-row{display:flex;flex-direction:row;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F0F3F6;cursor:pointer;}
.mat-row:last-child{border-bottom:none;}
.mat-thumb{width:40px;height:40px;border-radius:6px;background:#C9E9FA;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.mat-name{font-size:14px;color:var(--txt);flex:1;}
.mat-count{font-size:12px;color:var(--hint);}
.ap-footer{display:flex;flex-direction:row;gap:10px;padding:12px 12px 4px;}
.btn-reject,.btn-approve{flex:1;height:40px;line-height:40px;border-radius:20px;font-size:14px;font-weight:500;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.btn-reject{border:1px solid var(--err);color:var(--err);background:#fff;}
.btn-approve{background:var(--grad);color:#fff;border:none;}
/* 加载中 / 加载失败态（pages/approval .approval-state） */
.ap-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 0;cursor:pointer;}
.ap-spin{width:22px;height:22px;border-radius:50%;border:2px solid #C9E9FA;border-top-color:var(--pri);animation:bd-spin .8s linear infinite;}
.ap-state-t{font-size:13px;color:var(--hint);}
.ap-state-ic{font-size:28px;}
.ap-state-btn{font-size:12px;color:var(--pri);}
.ap-empty{text-align:center;color:var(--hint);font-size:13px;padding:48px 0;}
/* 材料分组（.material-group：图标 + 名称 + 说明 + 文件网格） */
.mat-group{padding:10px 0;border-bottom:1px solid #F0F3F6;}
.mat-group:last-child{border-bottom:none;}
.mat-group-hd{display:flex;flex-direction:row;align-items:center;gap:9px;}
.mat-group-ic{width:30px;height:30px;border-radius:8px;background:#E1F2FA;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.mat-group-main{display:flex;flex-direction:column;gap:2px;min-width:0;}
.mat-group-name{font-size:13px;font-weight:600;color:var(--txt);}
.mat-group-desc{font-size:11px;color:var(--hint);}
.mat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;}
.mat-grid-item{cursor:pointer;}
.mat-grid-img{width:100%;height:64px;border-radius:6px;}
.mat-file-card{height:64px;border:1px solid var(--line2);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;background:var(--bg2);}
.mat-file-ic{font-size:18px;}
.mat-file-name{font-size:10px;color:var(--txt);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.mat-file-ext{font-size:9px;color:var(--hint);}
.mat-empty{font-size:12px;color:var(--hint);padding:10px 0;}
/* 终态 / 审批记录进入：只读底栏（.ap-footer-readonly） */
.ap-footer-readonly{padding:14px 12px 4px;text-align:center;}
.ap-footer-readonly-text{font-size:12px;color:var(--hint);}
/* 已初审：蓝色信息标签 */
.tag-info{background:#E1F2FA;color:#0D86BE;}
/* 详情行：通过 / 未通过 着色 */
.info-row .v.pass{color:#2E7D32;font-weight:600;}
.info-row .v.fail{color:var(--err);font-weight:600;}
.info-row .v.st-warn{color:var(--warn2);font-weight:600;}
/* 现代风格驳回弹窗（.reject-dialog-modern） */
.rj-banner{background:linear-gradient(135deg,#FF4757 0%,#FF7A85 100%);margin:-24px -20px 0;padding:18px 16px;border-radius:26px 26px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px;}
.rj-banner-ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:17px;}
.rj-banner-t{font-size:16px;font-weight:700;color:#fff;}
.rj-banner-s{font-size:12px;color:rgba(255,255,255,.9);text-align:center;}
.rj-body{padding:14px 4px 0;}
.rj-label{display:flex;flex-direction:row;align-items:center;gap:3px;font-size:13px;color:var(--txt);font-weight:600;}
.rj-req{color:var(--err);}
.rj-textarea{box-sizing:border-box;width:100%;min-height:88px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;outline:none;resize:none;background:var(--bg2);color:var(--txt);font-family:inherit;}
.rj-counter{margin-top:4px;text-align:right;font-size:11px;color:var(--hint);}
.rj-actions{display:flex;flex-direction:row;gap:10px;margin-top:16px;}
.rj-btn{flex:1;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;cursor:pointer;}
.rj-btn--cancel{border:1px solid var(--line);color:var(--sub);background:#fff;}
.rj-btn--danger{background:var(--err);color:#fff;border:none;}
/* ==================== 仪器预约（pages/instrument-book） ==================== */
.bk-bg{background:var(--bg);}
.bk-ins{display:flex;flex-direction:row;align-items:center;gap:10px;margin:12px 12px 0;background:#fff;border-radius:10px;padding:12px;box-shadow:var(--shadow);}
.bk-ins-ic{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#DBEFF9,#C9E9FA);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.bk-ins-b{flex:1;min-width:0;}
.bk-ins-r{display:flex;flex-direction:row;align-items:center;gap:8px;}
.bk-ins-n{font-size:15px;font-weight:700;color:var(--txt);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bk-tag{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;flex-shrink:0;white-space:nowrap;}
.bk-tag.on{background:#DBEFF9;color:#0D86BE;}
.bk-tag.idle{background:#E1F2FA;color:#0D86BE;}
.bk-ins-m{display:block;font-size:11px;color:var(--hint);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-head{display:flex;flex-direction:row;align-items:center;justify-content:space-between;margin:2px 0 6px;}
.cal-arrow{width:26px;height:26px;border-radius:50%;background:#F0F4F8;color:#5A6E7E;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;user-select:none;line-height:1;}
.cal-arrow:active{opacity:.7;}
.cal-title{font-size:15px;font-weight:700;color:var(--t2);}
.cal-week{display:flex;flex-direction:row;margin-bottom:4px;}
.cal-week span{flex:1;text-align:center;font-size:10px;color:var(--hint);}
.cal-grid{display:flex;flex-wrap:wrap;}
.cal-cell{flex:0 0 14.2857%;height:34px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--txt);position:relative;cursor:pointer;border-radius:17px;user-select:none;}
.cal-cell.td{color:var(--acc);font-weight:700;}
.cal-cell.dis{color:var(--hint2);pointer-events:none;}
.cal-cell.sel{background:linear-gradient(135deg,#33ADDE,#0A7BB8);color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(27,82,112,.25);}
.cal-cell.td::after{content:'';position:absolute;bottom:2px;width:3px;height:3px;border-radius:50%;background:var(--acc);}
.cal-cell.td.sel::after{background:#fff;}
.bk-note{font-size:10px;color:var(--hint2);margin-top:6px;line-height:1.6;}
.bk-step{display:flex;flex-direction:row;align-items:center;gap:6px;background:#DFF1F9;border-radius:7px;padding:7px 10px;margin-bottom:4px;}
.bk-step.done{background:#E1F2FA;}
.bk-step-n{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#33ADDE,#0A7BB8);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;line-height:1;}
.bk-step.done .bk-step-n{background:#0D86BE;}
.bk-step-t{font-size:11px;color:#0A7BB8;flex:1;}
.bk-step.done .bk-step-t{color:#0D86BE;}
.bk-legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:9px 2px 11px;}
.bk-lg{display:flex;flex-direction:row;align-items:center;gap:4px;font-size:10px;color:var(--hint);}
.bk-lg i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.bk-lg i.li-sel{background:var(--grad);}
.bk-lg i.li-idle{background:#EAF6F0;border:1px solid #7FC8A8;}
.bk-lg i.li-occ{background:#FDECEA;border:1px solid #E8B0A8;}
.bk-lg i.li-off{background:#F0F4F6;border:1px solid #D6DDE2;}
/* v2 图例色块（当前预约黄 / 已占用蓝 / 空闲白 / 禁用灰） */
.bk-lg .lg-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
.lg-dot.sel{background:#FFC107;border:1px solid #F57F17;}
.lg-dot.occ{background:#0D86BE;border:1px solid #0D86BE;}
.lg-dot.idle{background:#FFFFFF;border:1px solid #BDBDBD;}
.lg-dot.off{background:#E0E0E0;border:1px solid #BDBDBD;}
/* v2 时段表：4 组 × 6 小时（每组表头 + 6 列 × 4 档小格，格子无文字、颜色表状态） */
.slot-tag{font-size:11px;font-weight:600;color:var(--t2);margin:2px 0 8px;}
.time-table{margin-top:2px;border:1px solid #D9D9D9;border-radius:4px;overflow:hidden;}
.time-group{border-bottom:1px solid #D9D9D9;}
.time-group:last-child{border-bottom:none;}
.group-header{display:flex;flex-direction:row;background:#E8E8E8;border-bottom:1px solid #D9D9D9;}
.header-cell{flex:1;text-align:center;font-size:11px;color:#333;padding:5px 0;border-right:1px solid #D9D9D9;line-height:1.4;}
.header-cell:last-child{border-right:none;}
.group-body{display:flex;flex-direction:row;}
.hour-col{flex:1;display:flex;flex-direction:row;border-right:1px solid #D9D9D9;}
.hour-col:last-child{border-right:none;}
.tcell{flex:1;height:26px;background:#FFFFFF;}
.tcell.idle{background:#FFFFFF;cursor:pointer;}
.tcell.idle:hover{background:#E8F4FD;}
.tcell.occ{background:#0D86BE;}
.tcell.off{background:#E0E0E0;cursor:not-allowed;}
.tcell.sel{background:#FFC107;}
/* v2 已选时间（渐变块 + 起止 chips + 共计汇总） */
.sel-section{margin-top:6px;background:linear-gradient(180deg,#ECF5FB,#E8F3FA);border:1px solid #E2EAF0;border-radius:10px;padding:11px 12px 9px;}
.sel-tip{font-size:11px;color:#5A7E9A;margin-bottom:7px;line-height:1.5;}
.sel-seg{background:#fff;border:1px solid #E0EBF3;border-radius:8px;padding:2px 9px;}
.seg-row{display:flex;flex-direction:row;align-items:center;gap:7px;padding:7px 0;}
.seg-row+.seg-row{border-top:1px dashed #EDF2F7;}
.seg-lab{width:38px;flex-shrink:0;font-size:14px;font-weight:700;color:var(--txt);line-height:1.4;}
.seg-chip{flex:1;min-width:0;text-align:center;font-size:13px;color:#0A7BB8;border:1px solid #D4E6F0;border-radius:6px;padding:6px 4px;background:#E8F3FA;font-weight:500;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none;}
.seg-chip.tm{color:var(--pri);border-color:#D5E4ED;background:#fff;}
.seg-chip.dis{color:#A8B6BF;border-color:#E1EBF2;background:#EEF4F8;font-weight:400;}
.sel-divider{height:1px;background:#DFEBF4;margin:7px 0 6px;}
.sel-total{display:flex;flex-direction:row;align-items:center;justify-content:space-between;background:#fff;border:1px solid #F3D9B0;border-radius:7px;padding:6px 10px;box-shadow:0 1px 4px rgba(180,130,40,.08);}
.sel-total .tl{display:flex;flex-direction:row;align-items:center;font-size:12px;font-weight:600;color:#A07932;}
.sel-total .tl::before{content:'';width:4px;height:13px;border-radius:2px;background:linear-gradient(180deg,#FFB300,#F57F17);margin-right:6px;}
.sel-total .tv{font-size:19px;font-weight:800;color:#E65100;letter-spacing:1px;line-height:1.3;text-align:right;}
/* 24h×15min 连续档位表（0~23 时，中间不断开） */
.qtable{margin-top:2px;}
.qrow{display:flex;flex-direction:row;align-items:center;}
.qrow+.qrow{margin-top:4px;}
.qhour{width:46px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--t2);}
.qcells{flex:1;display:flex;flex-direction:row;gap:2px;}
.qcell{flex:1;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;cursor:pointer;user-select:none;line-height:1;}
.qcell.idle{background:#EAF6F0;color:#1E7A4D;}
.qcell.occ{background:#FDECEA;color:#C0392B;}
.qcell.off{background:#F0F4F6;color:#B4BEC6;cursor:not-allowed;}
.qcell.sel{background:var(--grad);color:#fff;box-shadow:0 1px 3px rgba(10,123,184,.25);}
.bk-date{display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:2px 2px 8px;font-size:12px;}
.bk-date .k{color:var(--hint);}
.bk-date .v{color:var(--t2);font-weight:600;}
.time-grid{display:flex;flex-direction:row;gap:8px;}
.time-box{flex:1;background:#F5FAFE;border:1px solid #E3ECF3;border-radius:8px;padding:8px 4px;text-align:center;}
.time-box.on{border-color:var(--acc);background:#C9E9FA;}
.time-box .k{font-size:10px;color:var(--hint);display:block;}
.time-box .v{font-size:16px;font-weight:800;color:var(--t2);display:block;margin-top:2px;}
.time-box.on .v{color:var(--acc);}
.time-box.long .v{font-size:11px;}
.bk-warn{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--warn2);margin-top:8px;}
