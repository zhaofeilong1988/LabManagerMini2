.bk-warn.ok{color:#0D86BE;}
.dur-grid{display:flex;flex-direction:row;gap:8px;}
.dur-cell{flex:1;background:#F4F8FB;border-radius:8px;padding:10px 4px;text-align:center;}
.dur-cell.rec{background:#FFF8E1;border:1px solid #FFE082;}
.dur-cell .n{font-size:20px;font-weight:800;color:var(--pri);}
.dur-cell.rec .n{color:#E65100;}
.dur-cell .u{font-size:10px;color:var(--hint);margin-left:2px;}
.dur-cell .l{display:block;font-size:10px;color:var(--hint);margin-top:2px;}
.mode-opt{display:flex;flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;}
.mode-opt:last-child{margin-bottom:0;}
.mode-opt.on{border-color:#33ADDE;background:#DFF1F9;}
.mode-ic{width:20px;height:20px;border-radius:50%;border:1px solid #C0C9D2;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex-shrink:0;background:#fff;}
.mode-opt.on .mode-ic{background:var(--acc);border-color:var(--acc);}
.mode-b{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.mode-t{font-size:14px;font-weight:600;color:var(--t2);}
.mode-s{font-size:10px;color:var(--hint);line-height:1.5;}
.mode-p{font-size:16px;font-weight:800;color:var(--acc);white-space:nowrap;}
.mode-p em{font-style:normal;font-size:10px;color:var(--hint);font-weight:500;}
.bk-bar{position:sticky;bottom:0;z-index:50;display:flex;flex-direction:row;align-items:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);box-shadow:0 -2px 10px rgba(0,0,0,.08);}
.bk-cost{flex:1;min-width:0;}
.bk-cost-l{font-size:10px;color:var(--hint);}
.bk-cost-v{font-size:20px;font-weight:800;color:var(--pri);line-height:1.15;}
.bk-cost-s{font-size:10px;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bk-sub{flex-shrink:0;height:38px;padding:0 24px;border-radius:19px;background:var(--grad);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 8px rgba(10,123,184,.3);}
.bk-sub:active{opacity:.88;}
.bk-field+.bk-field{margin-top:12px;}
.bk-field-l{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:5px;}
.bk-field-i,.bk-field-t{width:100%;box-sizing:border-box;background:#F5FAFE;border:1px solid #E3ECF3;border-radius:8px;font-size:12px;color:var(--txt);padding:9px 12px;line-height:1.5;outline:none;font-family:inherit;}
.bk-field-i{height:38px;}
.bk-field-t{height:66px;resize:none;min-height:38px;}
.bk-field-i:focus,.bk-field-t:focus{border-color:var(--acc);background:#fff;}
.bk-field-i::placeholder,.bk-field-t::placeholder{color:#B4C0CB;}
/* ==================== 我的预约（pages/my-booking） ==================== */
.mb-page{padding-bottom:60px;}
.mb-tabs{display:flex;flex-direction:row;gap:10px;margin:12px 12px 0;}
.mb-tab{flex:1;text-align:center;padding:9px 0;border-radius:18px;background:var(--card);color:var(--hint);font-size:12px;font-weight:600;cursor:pointer;user-select:none;box-shadow:var(--shadow);}
.mb-tab.on{background:var(--grad);color:#fff;}
.mb-cnt{font-size:10px;background:#EEF1F4;color:var(--hint);border-radius:8px;padding:0 5px;margin-left:3px;}
.mb-tab.on .mb-cnt{background:rgba(255,255,255,.28);color:#fff;}
.mb-list{padding:12px;}
.mb-card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;user-select:none;}
.mb-hd{display:flex;flex-direction:row;align-items:center;gap:8px;}
.mb-ic{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,#DBEFF9,#C9E9FA);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.mb-b{flex:1;min-width:0;}
.mb-n{display:block;font-size:14px;font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mb-s{display:block;font-size:11px;color:var(--hint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mb-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:9px;flex-shrink:0;white-space:nowrap;}
.mb-tag-warn{background:#FFF3E0;color:var(--warn2);}
.mb-tag-ok{background:#E1F2FA;color:#0D86BE;}
.mb-tag-gray{background:#F0F4F8;color:var(--hint);}
/* 已拒绝（bookingStatus.js LIST_TAG.rejected） */
.mb-tag-err{background:var(--errbg);color:var(--err);}
/* 加载态：顶部细条 loading（my-booking/index.wxss） */
.mb-loading{display:flex;flex-direction:row;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line2);}
.mb-loading-bar{flex:1;height:2px;border-radius:1px;background:linear-gradient(90deg,#C9E9FA 0%,#33ADDE 50%,#C9E9FA 100%);background-size:200% 100%;animation:skel-shimmer 1.2s ease-in-out infinite;}
.mb-loading-t{font-size:11px;color:var(--hint);flex-shrink:0;}
/* 仪器图标+名称热区（catchtap 进仪器详情，阻止冒泡到卡片） */
.mb-inst{display:flex;flex-direction:row;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer;}
.mb-inst:active{opacity:.6;}
.mb-rows{background:#F7FAFD;border-radius:7px;padding:2px 11px;margin-top:10px;}
.mb-row{display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:7px 0;font-size:12px;border-bottom:1px solid #EFF3F7;}
.mb-row:last-child{border-bottom:none;}
.mb-row .k{color:var(--hint);flex-shrink:0;}
.mb-row .v{color:var(--txt);font-weight:600;text-align:right;flex:1;min-width:0;word-break:break-all;}
.mb-ft{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;}
.mb-sub{font-size:10px;color:var(--hint2);}
.mb-links{display:flex;flex-direction:row;gap:8px;align-items:center;}
.mb-btn{font-size:11px;font-weight:600;padding:5px 12px;border-radius:13px;cursor:pointer;user-select:none;background:#fff;}
.mb-btn--danger{border:1px solid #F0A5A5;color:var(--err);}
.mb-btn--danger:active{background:var(--errbg);}
.mb-btn--plain{border:1px solid var(--acc);color:var(--acc);}
.mb-btn--plain:active{background:var(--bluebg);}
/* 待审核：扫码按钮置灰（my-booking .mb-btn-plain--disabled） */
.mb-btn--disabled{border:1px solid #DDE3E8;color:#B0BEC5;cursor:default;}
.mb-btn--disabled:active{background:#fff;}
.mb-empty{text-align:center;color:var(--hint);font-size:12px;padding:56px 24px 16px;line-height:1.9;}
.mb-empty-ic{font-size:34px;display:block;}
.mb-empty-go{display:inline-flex;margin-top:12px;padding:8px 22px;border-radius:16px;background:var(--grad);color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
.mb-empty-go:active{opacity:.85;}

/* ==================== 预约详情（复刻 pages/booking-detail v1） ==================== */
.bd-loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:80px 0;}
.bd-load-spin{width:22px;height:22px;border-radius:50%;border:2px solid #C9E9FA;border-top-color:var(--pri);animation:bd-spin .8s linear infinite;}
.bd-load-t{font-size:12px;color:var(--hint);}
@keyframes bd-spin{to{transform:rotate(360deg);}}
.bd-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:80px 0;}
.bd-empty-ic{font-size:36px;}
.bd-empty-t{font-size:13px;color:var(--hint);}
.bd-page{padding:12px;}
.bd-head{margin-bottom:12px;}
.bd-head-row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;}
.bd-status{font-size:13px;font-weight:700;padding:4px 12px;border-radius:12px;}
.bd-status--ok{background:#E1F2FA;color:#0D86BE;}
.bd-status--warn{background:#FFF3E0;color:var(--warn2);}
.bd-status--err{background:var(--errbg);color:var(--err);}
.bd-status--gray{background:#F0F4F8;color:var(--hint);}
.bd-head-sub{font-size:11px;color:var(--hint);}
.bd-card{background:#fff;border-radius:8px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
.bd-card-t{display:flex;flex-direction:row;align-items:center;gap:6px;margin-bottom:8px;}
.bd-dot{width:3px;height:12px;border-radius:2px;background:var(--grad);flex-shrink:0;}
.bd-card-tt{font-size:13px;font-weight:700;color:var(--txt);}
.bd-card-tip{margin-left:auto;font-size:10px;color:var(--hint);}
.bd-row{display:flex;flex-direction:row;align-items:flex-start;gap:10px;padding:5px 0;}
.bd-row-k{width:88px;flex-shrink:0;font-size:12px;color:var(--hint);}
.bd-row-v{flex:1;min-width:0;font-size:12px;color:var(--txt);line-height:1.5;word-break:break-all;}
.bd-row--multi{align-items:flex-start;}
.bd-row-v--em{color:var(--warn2);font-weight:700;}
.bd-row-v--muted{color:var(--hint);}
.bd-fee{border:1px solid var(--line2);border-radius:6px;overflow:hidden;}
.bd-fee-row{display:flex;flex-direction:row;border-bottom:1px solid var(--line2);}
.bd-fee-row:last-child{border-bottom:none;}
.bd-fee-row--head{background:#F5FAFD;}
.bd-fee-cell{padding:7px 8px;font-size:11px;color:var(--txt);}
.bd-fee-cell--cat{flex:1;}
.bd-fee-cell--money{width:78px;text-align:right;}
.bd-fee-cell--self{color:var(--pri);font-weight:600;}
.bd-tip{margin-top:8px;font-size:10px;color:var(--hint);line-height:1.6;}
.bd-phone{color:var(--pri);font-weight:600;cursor:pointer;}
.bd-phone:active{opacity:.6;}
.bd-bottom{height:16px;}
/* ==================== 仪器详情 · 徽章/联系电话/说明（复刻 pages/instrument-detail v2） ==================== */
.id-flags{display:flex;flex-direction:row;flex-wrap:wrap;gap:5px;margin-top:7px;}
.id-flag{font-size:10px;padding:2px 9px;border-radius:8px;font-weight:500;line-height:1.6;}
.id-flag--book{background:#DBEFF9;color:#0D86BE;}
.id-flag--appr{background:#FFF3E0;color:#E65100;}
.id-phone{display:inline-flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:5px;color:#0A7BB8;font-weight:600;cursor:pointer;line-height:1.5;}
.id-phone-ic{flex-shrink:0;display:inline-flex;font-size:12px;line-height:1;}
.id-phone--hover{opacity:.55;}
.id-desc{margin-top:12px;padding:10px 12px;background:#EAF4FB;border-radius:6px;font-size:12px;color:#33576B;line-height:1.7;}
/* ==================== 扫描设备（复刻 pages/scan-device） ==================== */
.sd-page{min-height:100%;background:var(--bg);}
.sd-body{position:relative;}
.sd-content{padding:12px 12px 16px;}
.sd-loading{display:flex;flex-direction:column;align-items:center;padding-top:130px;}
.sd-loading-spin{width:32px;height:32px;border-radius:50%;border:3px solid #D4E6F0;border-top-color:#33ADDE;animation:sd-spin .8s linear infinite;}
@keyframes sd-spin{to{transform:rotate(360deg);}}
.sd-loading-t{margin-top:12px;font-size:12px;color:var(--hint);}
.sd-hero{display:flex;flex-direction:row;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:16px;box-shadow:var(--shadow);}
.sd-ic{width:52px;height:52px;border-radius:11px;background:linear-gradient(135deg,#DBEFF9,#C9E9FA);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.sd-hero-b{flex:1;min-width:0;}
.sd-name{display:block;font-size:17px;font-weight:700;color:var(--txt);line-height:1.35;}
.sd-lab{display:block;margin-top:4px;font-size:11px;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sd-status{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;border-radius:9px;padding:11px 13px;}
.sd-status-l{display:flex;flex-direction:row;align-items:center;gap:6px;min-width:0;}
.sd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sd-status-t{font-size:14px;font-weight:700;white-space:nowrap;}
.sd-status--on{background:#E1F2FA;}
.sd-status--on .sd-dot{background:#0D86BE;box-shadow:0 0 0 3px rgba(13,134,190,.15);}
.sd-status--on .sd-status-t{color:#0A7BB8;}
.sd-status--off{background:#FFF4E5;}
.sd-status--off .sd-dot{background:#E65100;box-shadow:0 0 0 3px rgba(230,81,0,.12);}
.sd-status--off .sd-status-t{color:#BF5000;}
.sd-status-time,.sd-status-tip{font-size:11px;color:var(--hint);text-align:right;line-height:1.5;}
.sd-card{background:#fff;border-radius:12px;margin-top:10px;padding:4px 14px;box-shadow:var(--shadow);}
.sd-row{display:flex;flex-direction:row;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;font-size:13px;border-bottom:1px solid #EFF3F7;}
.sd-row:last-child{border-bottom:none;}
.sd-row .k{color:var(--hint);flex-shrink:0;line-height:1.5;}
.sd-row .v{flex:1;min-width:0;color:var(--txt);font-weight:600;text-align:right;line-height:1.5;word-break:break-all;}
.sd-no{color:var(--pri);font-family:Menlo,Consolas,monospace;}
.sd-v-ok{color:#0D86BE;}
.sd-v-off{color:#BF5000;}
.sd-hint{margin-top:10px;font-size:11px;color:var(--hint);text-align:center;}
.sd-cta{position:sticky;bottom:0;z-index:40;margin-top:12px;background:#fff;padding:10px 12px;box-shadow:0 -2px 10px rgba(0,0,0,.06);}
.sd-btn{height:46px;border-radius:23px;background:linear-gradient(135deg,#33ADDE,#0A7BB8);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 8px rgba(10,123,184,.28);}
.sd-btn:active{transform:scale(.98);opacity:.9;}
.sd-btn--disabled{opacity:.7;cursor:default;}
.sd-miss{display:flex;flex-direction:column;align-items:center;padding:110px 30px 0;}
.sd-miss-ic{font-size:45px;}
.sd-miss-t{margin-top:12px;font-size:14px;color:var(--hint);}
.sd-miss-btn{margin-top:24px;padding:10px 40px;border-radius:20px;background:linear-gradient(135deg,#0A7BB8,#33ADDE);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.sd-miss-btn:active{opacity:.85;}
/* ==================== 模拟扫码浮层 ==================== */
.scan-frame{height:150px;border-radius:10px;margin:4px 14px 8px;background:#0E1C26;position:relative;overflow:hidden;}
.scan-frame::before,.scan-frame::after{content:'';position:absolute;width:26px;height:26px;border:2px solid #33ADDE;}
.scan-frame::before{top:10px;left:10px;border-right:none;border-bottom:none;}
.scan-frame::after{bottom:10px;right:10px;border-left:none;border-top:none;}
.sf-line{position:absolute;left:10%;right:10%;top:12%;height:2px;background:#33ADDE;box-shadow:0 0 12px #33ADDE;animation:scanline 2s ease-in-out infinite;}
@keyframes scanline{0%,100%{top:14%;}50%{top:84%;}}
.sf-txt{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.72);}
.scan-title{font-weight:700;font-size:15px;padding:10px 14px 2px;color:var(--txt);}
.scan-sub{font-size:11px;color:var(--hint);padding:2px 14px 6px;line-height:1.6;}
.scan-input-wrap{display:flex;flex-direction:row;gap:8px;padding:2px 14px 6px;}
.scan-input{flex:1;border:1px solid var(--line);border-radius:8px;height:36px;padding:0 10px;font-size:13px;outline:none;color:var(--txt);}
.scan-input:focus{border-color:var(--acc);}
.scan-btn-go{height:36px;padding:0 16px;border-radius:18px;background:var(--grad);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;flex-shrink:0;}
.scan-tip{font-size:10px;color:var(--hint2);padding:0 14px 6px;line-height:1.5;}
.scan-chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 14px 12px;}
.scan-chip{border:1px solid #C9E9FA;background:#EFF6FB;color:#0A7BB8;font-size:11px;padding:4px 10px;border-radius:13px;cursor:pointer;line-height:1.5;}
.scan-chip:active{opacity:.7;}
/* ==================== 仪器扫码详情（复刻 pages/scan-detail） ==================== */
.sd2-content{padding:12px 12px 30px;}
.sd2-state{display:flex;flex-direction:column;align-items:center;padding:110px 30px 0;}
.sd2-spin{width:32px;height:32px;border-radius:50%;border:3px solid #D4E6F0;border-top-color:var(--acc);animation:sd2-spin .8s linear infinite;}
@keyframes sd2-spin{to{transform:rotate(360deg);}}
.sd2-state-t{margin-top:12px;font-size:13px;color:var(--hint);text-align:center;line-height:1.6;}
.sd2-err-ic{font-size:45px;}
.sd2-state-btn{display:inline-flex;align-items:center;justify-content:center;min-width:160px;padding:10px 40px;border-radius:20px;background:var(--grad);color:#fff;font-size:14px;font-weight:600;text-align:center;cursor:pointer;box-sizing:border-box;}
.sd2-state-btn:active{opacity:.85;}
.sd2-state-btn--ghost{margin-top:12px;background:#fff;color:var(--pri);border:1px solid #CFE3EE;}
.sd2-hero{display:flex;flex-direction:row;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:16px;box-shadow:var(--shadow);}
.sd2-hero-ic{width:52px;height:52px;border-radius:11px;background:linear-gradient(135deg,#DBEFF9,#C9E9FA);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.sd2-hero-b{flex:1;min-width:0;}
.sd2-hero-t{display:block;font-size:16px;font-weight:700;color:var(--txt);line-height:1.35;}
.sd2-no{display:block;margin-top:5px;font-size:13px;font-family:Menlo,Consolas,monospace;color:var(--pri);word-break:break-all;}
.sd2-card{background:#fff;border-radius:12px;margin-top:10px;padding:4px 14px;box-shadow:var(--shadow);overflow:hidden;}
.sd2-row{display:flex;flex-direction:row;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;font-size:13px;border-bottom:1px solid #E1EBF2;}
.sd2-row:last-child{border-bottom:none;}
.sd2-k{color:var(--hint);flex-shrink:0;line-height:1.5;font-size:12px;}
.sd2-v{flex:1;min-width:0;color:var(--txt);font-weight:600;text-align:right;line-height:1.5;word-break:break-all;}
.sd2-v--strong{font-size:15px;font-weight:700;}
.sd2-v--mono{font-family:Menlo,Consolas,monospace;word-break:break-all;}
.sd2-v--ok{color:var(--ok);}
.sd2-v--off{color:var(--warn2);}
.sd2-power{margin-top:10px;padding:13px 0;border-radius:12px;font-size:15px;font-weight:700;text-align:center;letter-spacing:1px;cursor:pointer;user-select:none;box-sizing:border-box;}
.sd2-power--on{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(10,123,184,.25);}
.sd2-power--off{background:#fff;color:var(--warn2);border:1px solid #F4C9A8;box-shadow:var(--shadow);}
.sd2-power:active{opacity:.82;}
/* 操作进行中（复刻 pages/scan-detail 的 powerBusy：按钮不可重复点击） */
.sd2-power--busy{background:#E3EBF1;color:var(--hint);border:1px solid #DCE5EC;box-shadow:none;cursor:default;}
/* 蓝牙操作进度提示（复刻 .sd2-ble-msg：搜索设备 / 握手 / 同步服务器 等阶段性文案） */
.sd2-ble-msg{margin-top:8px;font-size:12px;color:var(--hint);text-align:center;line-height:1.6;}
.sd2-phone{display:inline-flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:5px;color:var(--pri);font-weight:600;cursor:pointer;line-height:1.5;}
.sd2-phone:active{opacity:.55;}
.sd2-phone .id-phone-ic{flex-shrink:0;display:inline-flex;font-size:12px;line-height:1;}
.sd2-hint{margin-top:10px;font-size:11px;color:var(--hint);text-align:center;line-height:1.6;}
/* ==================== 申请登记 · 所内/所外单选 + 可搜索下拉（register 改造） ==================== */
/* 人员类型单选 chips（所内 / 所外） */
.rg-chips{flex:1;min-width:0;display:flex;flex-direction:row;gap:8px;}
.rg-chip{flex:1;text-align:center;padding:7px 0 8px;border-radius:16px;font-size:13px;color:var(--hint);background:#F4F8FB;border:1px solid var(--line);cursor:pointer;user-select:none;line-height:1.4;white-space:nowrap;}
.rg-chip.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 2px 6px rgba(10,123,184,.22);}
/* 下拉选择行（视觉与输入框一致：label + 可点区域 + 箭头） */
.f-sel{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:8px;cursor:pointer;padding:2px 0;}
.f-sel:active{opacity:.7;}
.fs-ph{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#B4C0CB;line-height:1.5;text-align:left;}
.fs-ph.fs-has{color:var(--txt);font-weight:500;}
.fs-ar{flex-shrink:0;color:#B4C0CB;font-size:15px;line-height:1;transform:rotate(90deg);}
/* 可搜索选择底部弹层（sheet 内） */
.rp-hd{display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 16px 4px;}
.rp-title{font-size:16px;font-weight:700;color:var(--txt);}
.rp-cancel{font-size:13px;color:var(--hint);cursor:pointer;padding:2px 4px;}
.rp-search-wrap{padding:8px 14px 4px;}
.rp-search{display:flex;flex-direction:row;align-items:center;gap:6px;background:#F0F4F8;border-radius:17px;padding:0 12px;height:34px;}
.rp-search-ic{font-size:13px;color:var(--hint);flex-shrink:0;}
.rp-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:13px;color:var(--txt);height:100%;}
.rp-list{max-height:320px;overflow-y:auto;padding:4px 6px 10px;-webkit-overflow-scrolling:touch;}
.rp-it{display:flex;flex-direction:column;gap:2px;padding:11px 12px;border-radius:8px;cursor:pointer;user-select:none;}
.rp-it:active{background:#F0F7FC;}
.rp-it-n{font-size:14px;color:var(--txt);font-weight:500;line-height:1.4;}
.rp-it-s{font-size:11px;color:var(--hint);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-it-empty{padding:22px 12px;font-size:12px;color:var(--hint);text-align:center;line-height:1.7;}
/* ==================== 实验工位（复刻 pages/workbench/index） ==================== */
.wb-page{padding:12px;background:var(--bg);min-height:100%;}
.ck-head-hd{display:flex;align-items:center;gap:8px;}
.ck-head-icon{font-size:20px;line-height:1;}
.ck-head-title{font-size:17px;font-weight:700;color:var(--txt);}
.ck-badge{margin-left:auto;font-size:11px;padding:2px 10px;border-radius:10px;line-height:16px;}
.ck-badge--using{background:var(--greenbg);color:#0D86BE;}
/* 待审核 / 已驳回（小程序 STATUS：reviewing #FFF3E0+#FF9800、rejected #FFEBEE+#C62828） */
.ck-badge--reviewing{background:#FFF3E0;color:#FF9800;}
.ck-badge--rejected{background:#FFEBEE;color:#C62828;}
.ck-head-sub{margin-top:6px;font-size:12px;color:var(--hint);}
.ck-head-rows{margin-top:10px;border-top:1px solid var(--line2);padding-top:4px;}
.ck-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;}
.ck-row-key{color:var(--hint);}
.ck-row-val{font-weight:600;color:var(--txt);}
.ck-val-orange{color:#FF8F00;}
.ck-val-green{color:#0D86BE;}
.ck-t-wrap{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ck-t-icon{font-size:18px;line-height:1;}
.ck-t{font-size:15px;font-weight:700;color:var(--txt);}
.ck-scan-code{font-size:26px;font-weight:800;letter-spacing:3px;color:var(--pri);text-align:center;padding:6px 0 2px;}
.ck-scan-tip{display:block;text-align:center;font-size:11px;color:var(--hint);margin-bottom:12px;line-height:1.6;}
.ck-bars{display:flex;align-items:flex-end;gap:2px;height:64px;padding:4px 0;}
.ck-bar{flex:1;background:#E4EEF5;border-radius:2px 2px 0 0;min-height:6px;}
.ck-bar.on{background:var(--grad);}
.ck-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--hint);margin-top:4px;}
.ck-rec-list{display:flex;flex-direction:column;}
.ck-rec-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px;color:var(--sub);}
.ck-rec-item:last-child{border-bottom:none;}
/* 重置实验工位按钮（复刻 workbench/index.wxss .ck-reset：40rpx→20px、14rpx→7px、26rpx→13px…） */
.ck-reset{margin:20px 0 4px;display:flex;flex-direction:column;align-items:center;gap:5px;}
.ck-reset-btn{display:inline-flex;flex-direction:row;align-items:center;gap:4px;padding:7px 16px;background:#FFF3E0;border:1px solid #FFB300;border-radius:20px;box-shadow:0 1px 4px rgba(255,179,0,.15);cursor:pointer;user-select:none;}
.ck-reset-btn:active{background:#FFE0B2;transform:scale(.98);}
.ck-reset-ic{font-size:14px;color:#B26500;line-height:1;}
.ck-reset-t{font-size:13px;font-weight:600;color:#B26500;}
.ck-reset-tip{font-size:11px;color:#6E7F8A;text-align:center;line-height:1.5;padding:0 12px;}
/* 实验工位申请表单（复刻 workbench/index.wxss .wb-*：rpx→px 2:1） */
.wb-card-hd{display:flex;flex-direction:row;align-items:center;gap:6px;}
.wb-hd-icon{font-size:17px;}
.wb-hd-title{flex:1;font-size:16px;font-weight:700;color:#161C20;}
.wb-hd-sub{display:block;margin-top:4px;font-size:12px;color:#6E7F8A;line-height:1.6;}
.wb-row{display:flex;flex-direction:row;align-items:center;padding:11px 0;border-bottom:1px solid #F0F5F8;cursor:pointer;}
.wb-row:last-child{border-bottom:none;}
.wb-row-key{font-size:16px;color:#B7C2C9;font-weight:400;flex-shrink:0;min-width:72px;}
.wb-row-val{flex:1;min-width:0;}
.wb-row-val-flex{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:4px;}
.wb-text{color:#161C20;}
.wb-placeholder{color:#B7C2C9;font-weight:400;}
.wb-arrow{font-size:16px;color:#C2CAD0;line-height:1;}
/* 课题组弹层：搜索框 + 两行选项（名称 / 实验室）+ 当前项打勾 */
.wb-kw{box-sizing:border-box;width:100%;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:var(--bg2);font-size:13px;font-family:inherit;color:var(--txt);outline:none;}
.wb-kw:focus{background:#fff;border-color:var(--acc);}
.wb-opt{justify-content:flex-start !important;gap:10px !important;padding:0 12px;background:var(--bg2);}
.wb-opt.on{background:#E8F4FB;}
.wb-opt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.wb-opt-n{font-size:14px;font-weight:600;color:var(--txt);line-height:1.3;}
.wb-opt.on .wb-opt-n{color:var(--pri);}
.wb-opt-s{font-size:11px;color:var(--hint);}
.wb-opt-ck{font-size:14px;color:var(--pri);flex-shrink:0;}
.wb-cal-tip{margin-top:8px;font-size:11px;color:var(--hint);text-align:center;line-height:1.5;}
.wb-block-title-row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:8px;}
.wb-block-title{display:block;font-size:14px;font-weight:600;color:#161C20;margin-bottom:8px;}
.wb-block-title-row .wb-block-title{margin-bottom:0;}
.wb-block-hint{font-size:11px;color:#6E7F8A;}
.wb-textarea{box-sizing:border-box;width:100%;min-height:90px;padding:10px;background:#F5FAFD;border:1px solid #E6EFF5;border-radius:6px;font-size:13px;color:#161C20;line-height:1.6;outline:none;resize:vertical;font-family:inherit;}
.wb-textarea-count{display:block;text-align:right;font-size:11px;color:#B7C2C9;margin-top:4px;}
.wb-reason-text{display:block;font-size:13px;color:#41484D;line-height:1.7;background:#F5FAFD;border-radius:6px;padding:10px;}
.wb-photo-list{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;}
.wb-photo-item{position:relative;}
.wb-photo-file{width:90px;height:90px;border:1px solid var(--line2);border-radius:6px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;box-sizing:border-box;}
.wb-photo-file-name{font-size:10px;color:var(--txt);text-align:center;line-height:1.3;max-height:26px;overflow:hidden;}
.wb-photo-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.wb-photo-add{width:90px;height:90px;border:1px dashed #C2CAD0;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;color:#9AA6AD;font-size:22px;cursor:pointer;}
.wb-photo-add:active{background:#F5FAFD;}
.wb-photo-add-text{font-size:11px;color:#6E7F8A;}
.wb-submit-bar{margin-top:16px;}
.wb-submit-btn{width:100%;height:44px;border-radius:22px;background:linear-gradient(135deg,#0A7BB8,#33ADDE);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(10,123,184,.28);}
.wb-submit-btn:active{opacity:.88;}
.wb-mock-btn{width:100%;height:44px;border-radius:22px;background:#fff;color:#0A7BB8;font-size:15px;font-weight:600;border:1px solid #0A7BB8;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.wb-mock-btn:active{background:#EAF4FB;}
/* ==================== 值日管理（复刻 pages/duty-admin/index） ==================== */
.da-page{padding:14px 12px 24px;background:#F2F7FB;min-height:100%;}
.da-head{display:flex;align-items:center;padding:16px 14px;margin-bottom:12px;background:linear-gradient(135deg,#0A7BB8 0%,#0D86BE 50%,#2BA3D4 100%);border-radius:14px;box-shadow:0 4px 12px rgba(10,123,184,.18);}
.da-head-icon-wrap{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-right:10px;flex-shrink:0;}
.da-head-icon{font-size:24px;line-height:1;}
.da-head-info{display:flex;flex-direction:column;}
.da-head-title{font-size:17px;font-weight:700;color:#fff;letter-spacing:1px;}
.da-head-sub{margin-top:3px;font-size:11px;color:rgba(255,255,255,.82);}
.da-leader{position:relative;display:flex;align-items:center;padding:14px;margin-bottom:14px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(10,123,184,.08);overflow:hidden;}
.da-leader::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#0A7BB8 0%,#2BA3D4 100%);}
.da-leader-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0A7BB8 0%,#2BA3D4 100%);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 10px 0 6px;box-shadow:0 2px 6px rgba(10,123,184,.25);flex-shrink:0;}
.da-leader-info{flex:1;display:flex;flex-direction:column;}
.da-leader-tag{font-size:11px;color:#6b7785;}
.da-leader-name{margin-top:3px;font-size:18px;font-weight:700;color:#1f2d3d;}
.da-leader-badge{padding:3px 7px;border-radius:999px;background:rgba(10,123,184,.1);color:#0A7BB8;font-size:10px;font-weight:700;letter-spacing:1px;}
.da-list{background:#fff;border-radius:12px;padding:4px 0;box-shadow:0 2px 8px rgba(10,123,184,.06);}
.da-row{display:flex;align-items:center;padding:12px 14px;border-top:1px solid #eef2f6;}
.da-row:first-child{border-top:none;}
.da-row-day{width:84px;flex-shrink:0;display:flex;flex-direction:column;}
.da-row-dow{font-size:16px;font-weight:700;color:#1f2d3d;}
.da-row-num{margin-top:2px;font-size:10px;color:#9aa6ad;font-weight:600;}
.da-row-divider{width:1px;height:28px;margin-right:12px;background:linear-gradient(180deg,transparent 0%,#d9e3eb 50%,transparent 100%);flex-shrink:0;}
.da-row-people{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:8px;min-width:0;}
.da-person{display:flex;align-items:center;min-width:0;}
.da-person-avatar{width:28px;height:28px;border-radius:50%;background:#E8F4FA;color:#0A7BB8;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:6px;border:1px solid #CFE8F4;flex-shrink:0;}
.da-person--second .da-person-avatar{background:#F0F8FF;color:#1E88E5;border-color:#BBDEFB;}
.da-person-name{font-size:14px;color:#1f2d3d;font-weight:500;}
.da-row-plus{display:flex;align-items:center;justify-content:center;width:16px;height:28px;margin-left:-20px;font-size:14px;color:#cbd2d9;flex-shrink:0;}
.da-tip{margin-top:14px;text-align:center;font-size:11px;color:#9aa6ad;}
/* ── 2026-10-29 同步 duty-admin/index.wxss：今天整行高亮（.da-row--today）──
   底色 #CBE7F6 → #E1F2FB、左侧竖条 10rpx=5px #0A7BB8、文字 #075C8A、头像实心蓝 */
.da-row--today{background:linear-gradient(90deg,#CBE7F6 0%,#E1F2FB 100%);box-shadow:inset 5px 0 0 #0A7BB8,0 1px 6px rgba(10,123,184,.12);}
.da-row--today .da-row-dow{color:#075C8A;}
.da-row--today .da-row-num{color:#075C8A;font-weight:700;}
.da-row--today .da-person-name{color:#075C8A;font-weight:700;}
.da-row--today .da-person-avatar{background:#0A7BB8;color:#fff;border-color:#0A7BB8;}
.da-row--today .da-person--second .da-person-avatar{background:#0D86BE;color:#fff;border-color:#0D86BE;}
.da-row--today .da-row-plus{color:#7FA9BF;}
/* ── 底部浮动「值日打卡」按钮（同步 duty-admin/index.wxss .da-fab*）──
   按钮高 92rpx=46px、左右/上下留白 18rpx=9px、32rpx=16px；打卡后置灰 .da-fab--done */
.da-page{position:relative;}
.da-page--fab{padding-bottom:96px;}
.da-fab-wrap{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:9px 16px;
  background:rgba(255,255,255,.94);border-top:1px solid #EEF2F6;}
.da-fab{height:46px;border-radius:23px;display:flex;flex-direction:row;align-items:center;justify-content:center;
  gap:6px;cursor:pointer;transition:transform .15s ease;

/* ============================================================
   今日同步新增：
   管理功能卡片（pages/instrument-detail）
   使用记录卡片（pages/instrument-logs）
   预约审批列表 / 审批详情（pages/booking-approval、pages/booking-approve）
   预约调整（pages/booking-adjust）

/* ── 仪器详情页「管理功能」：标题居中 + 三宫格 ── */
.id-card-t--center{justify-content:center;}
.id-acts{display:flex;flex-direction:row;gap:9px;}

/* ── 预约审批：金额 + 状态徽标（使用记录的类型标签已迁到 .il-tag-*） ── */
.lg-pay{display:flex;flex-direction:row;align-items:baseline;gap:5px;flex:1;min-width:0;}
.lg-pay-k{font-size:11px;color:var(--hint);flex-shrink:0;}
.lg-pay-v{font-size:19px;font-weight:800;color:#2E9E5B;line-height:1.2;}
.lg-pay-v--blue{color:var(--pri);}
.ba-tag-pending{background:#EAF2F7;color:#365B73;}
.ba-tag-approved{background:#E8F5E9;color:#2E7D32;}
.ba-tag-noshow{background:#FFF3E0;color:#E65100;}
.ba-tag-off{background:#EDE7F6;color:#5E35B1;}
.ba-tag-expired{background:#ECEFF1;color:#546E7A;}
.ba-tag-rejected{background:#FCE8E6;color:#BA1A1A;}
.ba-tag-cancelled{background:#F1F3F5;color:#78909C;}
.ba-btn-primary{border:1px solid var(--pri);background:var(--grad);color:#fff;}

/* ── 审批详情（pages/booking-approve） ── */
.bp-page{padding:10px 12px 0;}
.bp-head{font-size:15px;font-weight:700;color:var(--t2);padding:8px 2px 12px;border-bottom:1px solid var(--line);}

.bp-field{display:flex;flex-direction:row;align-items:center;gap:10px;margin-bottom:10px;}
.bp-field-k{width:96px;flex-shrink:0;font-size:12px;color:var(--hint);}
.bp-input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:4px;padding:0 10px;font-size:12px;outline:none;}

.bp-total-k{font-size:12px;color:var(--hint);}
.bp-total-f{flex:1;min-width:0;font-size:12px;color:var(--txt);}
.bp-total-v{font-size:16px;font-weight:800;color:#2E9E5B;}
.bp-textarea{width:100%;height:72px;border:1px solid var(--line);border-radius:7px;padding:8px;font-size:12px;outline:none;resize:none;}
.bp-acts{display:flex;flex-direction:row;gap:10px;margin-top:6px;}
.bp-act{flex:1;text-align:center;padding:11px 0;border-radius:22px;font-size:13px;font-weight:600;cursor:pointer;}
.bp-act--ok{background:#43A047;color:#fff;}
.bp-act--no{background:#E53935;color:#fff;}
.bp-act--close{background:#fff;color:var(--sub);border:1px solid #CFD8DC;}
.bp-bottom{height:14px;}

.il-btn-t{font-size:11px;font-weight:600;color:#0A7BB8;line-height:1;}
/* ── 修改上机记录（pages/instrument-log-edit/index.wxss） ── */
.le-page{background:#F5FAFD;padding:12px 12px 0;}

.le-row{display:flex;flex-direction:row;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F4F8;}

.le-vbox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.le-dur{font-size:11px;font-weight:600;color:#4CAF50;}
.le-edit{flex-shrink:0;display:flex;flex-direction:row;align-items:center;gap:3px;padding:4px 9px;border-radius:12px;background:#EFF6FB;border:1px solid #D5E4ED;cursor:pointer;}

/* 行尾删除 */

/* 标题右侧「添加」按钮 */
.le-add{margin-left:auto;flex-shrink:0;display:flex;flex-direction:row;align-items:center;gap:3px;height:26px;padding:0 11px;border:1px solid #CFE0EC;border-radius:13px;background:#F7FBFD;font-size:12px;color:#0A7BB8;cursor:pointer;user-select:none;}
.le-add:active{background:#E9F2F8;}
.le-add-t{font-size:12px;font-weight:600;color:#0A7BB8;line-height:1;}
.le-field{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}

.le-op{flex-shrink:0;height:32px;line-height:32px;font-size:14px;color:#8A99A8;}
.le-lines{padding:10px 0 4px;}
.le-line{display:flex;flex-direction:row;align-items:center;gap:8px;padding:6px 0;}
.le-line-k{flex-shrink:0;width:75px;font-size:13px;color:#6B7785;}
.le-line .le-in{flex:1;min-width:0;max-width:140px;}
.le-unit{font-size:13px;color:#8A99A8;}
.le-pay{border-radius:10px;padding:13px 14px;background:linear-gradient(180deg,#fff,#F7FBFD);border:1px solid #DCEBF5;box-shadow:0 1px 6px rgba(0,0,0,.04);}
.le-pay-row{display:flex;flex-direction:row;align-items:baseline;justify-content:space-between;}
.le-pay-k{font-size:13px;color:#6B7785;}
.le-pay-v{font-size:22px;font-weight:800;color:#0A7BB8;line-height:1.2;}
.le-pay-formula{margin-top:7px;padding-top:7px;border-top:1px solid #EDF1F5;}
.le-pay-txt{font-size:11px;color:#8A99A8;line-height:1.7;word-break:break-all;}
.le-pay-total{color:#0A7BB8;font-weight:700;}
.le-bar{position:sticky;bottom:0;z-index:40;margin-top:14px;display:flex;flex-direction:row;gap:15px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #EDF1F5;}
.le-btn{flex:1;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;font-size:16px;font-weight:600;cursor:pointer;}
.le-btn--cancel{background:#F5F6F7;border:1px solid #E2E6EA;color:#161C20;}
.le-btn--ok{background:linear-gradient(135deg,#33ADDE,#0A7BB8);color:#fff;box-shadow:0 4px 10px rgba(27,82,112,.24);}
.le-btn:active{opacity:.85;}
/* 选择上机用户：底部弹起的人员列表（头像 + 姓名 + 登录号 + 选中打勾） */
.le-opt-wrap{max-height:56vh;overflow-y:auto;padding:0 14px 16px;display:flex;flex-direction:column;}
.le-opt{display:flex;flex-direction:row;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;border-bottom:1px solid #F3F6F9;}
.le-opt:last-child{border-bottom:none;}
.le-opt.on{background:#EFF6FB;}
.le-opt:hover{background:#F5FAFD;}
.le-opt-av{flex-shrink:0;width:38px;height:38px;border-radius:50%;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.le-opt-b{flex:1;min-width:0;display:flex;flex-direction:column;}
.le-opt-n{font-size:15px;font-weight:600;color:#161C20;}
.le-opt-l{font-size:12px;color:#6E7F8A;margin-top:3px;}
.le-opt-ck{flex-shrink:0;color:#0A7BB8;font-size:16px;font-weight:700;}

.bd-adjust{margin-top:12px;height:42px;border-radius:21px;background:linear-gradient(135deg,#33ADDE,#0A7BB8);color:#fff;font-size:14px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 10px rgba(27,82,112,.24);}

.dis-time{display:flex;flex-direction:row;align-items:center;gap:5px;margin-top:7px;}
.dis-input{box-sizing:border-box;height:28px;line-height:28px;padding:0 7px;font-size:12px;font-weight:600;color:#161C20;text-align:center;background:#fff;border:1px solid #CFD8DC;border-radius:4px;font-family:inherit;}
.dis-input--edit{border-color:#33ADDE;background:#F2FAFE;}
.dis-input--readonly{color:#6E7F8A;background:#F2F5F7;width:75px;}
.dis-sel{box-sizing:border-box;height:28px;margin-left:auto;font-size:12px;font-weight:600;color:#0A7BB8;background:#fff;border:1px solid #CFD8DC;border-radius:4px;font-family:inherit;}
.dis-sep{flex-shrink:0;font-size:12px;color:#8A99A8;}
/* 日历 spot：蓝点＝有预约，灰点＝有禁用（参考 calendar 的 spot） */
.cal-cell{position:relative;}

.cal-spot--ban{background:#B0BFC8;}

.ad-item-btn--save{background:#0A7BB8;}
.ad-item-btn:active{opacity:.86;}
.ad-user{display:flex;flex-direction:row;align-items:center;flex-wrap:wrap;margin-top:8px;}
.ad-user-k{font-size:13px;font-weight:600;color:#161C20;}
.ad-user-n{font-size:13px;color:#161C20;}
.ad-user-wx{font-size:13px;color:#161C20;}

.ad-row{display:flex;flex-direction:row;align-items:center;gap:6px;margin-top:7px;}

.ad-picker{flex:1;min-width:0;display:block;}

.ad-box{box-sizing:border-box;width:100%;height:32px;border:1px solid #C9D3DA;border-radius:2px;background:#fff;display:flex;align-items:center;padding:0 8px;font-size:14px;color:#161C20;}

.cal-arrow.dis{opacity:.35;cursor:default;}
</style>
</head>

/* 居中卡片弹窗（复刻 .ob-modal / register 弹窗视觉） */
function modal(opt){
  const rows = (opt.rows||[]).map(r=>`<div class="d-row"><span class="k">${r.k}</span><span class="v">${r.v}</span></div>`).join('');
  const inputHtml = opt.input ? `<input class="d-input" id="dlgInput" placeholder="${opt.inputPh||''}" value="${esc(opt.inputVal||'')}">` : '';
  const btns = opt.btns || [{t:opt.okText||'确定', c:'confirm', fn:()=>{closeOverlay(); opt.ok&&opt.ok();}}];
  const btnHtml = btns.map(b=>`<div class="d-abtn ${b.c==='btn-gray'?'cancel':b.c==='btn-grad'||b.c==='btn-danger'?b.c==='btn-danger'?'danger':'grad':b.c||'confirm'}" onclick="${b.fn||'closeOverlay()'}">${b.t}</div>`).join('');
  overlay(`${opt.icon?`<div class="d-ic">${opt.icon}</div>`:''}
    ${opt.title?`<div class="d-t">${opt.title}</div>`:''}
    ${opt.sub?`<div class="d-s">${opt.sub}</div>`:''}
    ${opt.rows&&opt.rows.length?`<div class="d-rows">${rows}</div>`:''}
    ${inputHtml}
    <div class="d-actions">${btnHtml}</div>`);
  const inp = $('dlgInput'); if(inp) inp.focus();
}

const SCREENS = {};
function registerScreen(id, build, refresh){ SCREENS[id] = { build, refresh }; }
function currentScreen(){ const s=document.querySelector('.screen.active'); return s?s.dataset.id:'home'; }
function show(id, refreshAll){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  let el = $('scr-'+id);
  if(!el){ if(SCREENS[id].build) SCREENS[id].build(); el = $('scr-'+id); }
  el.classList.add('active');
  el.scrollTop = 0;
  const isTab = TAB_IDS.indexOf(id) >= 0;
  document.querySelector('.toolbar').style.display = isTab ? 'flex' : 'none';
  if(!isTab){ if(SCREENS[id].refresh) SCREENS[id].refresh(); }
  else if(refreshAll || !(el.dataset.done)){ if(SCREENS[id].refresh) SCREENS[id].refresh(); }
  el.dataset.done = '1';
}
function refresh(id){ if(SCREENS[id] && SCREENS[id].refresh) SCREENS[id].refresh(); }
function go(id, p){
  if(id !== currentScreen()) navStack.push(currentScreen());
  if(p) params[id] = p; else delete params[id];
  show(id, true);
}
function back(){ const prev = navStack.pop(); show(prev || 'home', true); }
function switchTab(tab){
  if(tab === currentTab){ show(tab, true); return; }
  currentTab = tab;
  navStack = [];
  document.querySelectorAll('.tb-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  show(tab, true);
}

const LG_DEPT_TAG = { '所内':'il-tag-in', '所外':'il-tag-out', '院外':'il-tag-ext' };
/* 时长：与 pages/instrument-logs/index.js durText 同口径（按分钟取整，「x小时y分钟」） */
function lgDurText(b, f){
  const bt = new Date(String(b).replace(/-/g, '/')).getTime();
  const ft = new Date(String(f).replace(/-/g, '/')).getTime();
  if(isNaN(bt) || isNaN(ft) || ft <= bt) return '';
  const mins = Math.round((ft - bt) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  if(!mins) return '不足1分钟';
  return (h ? h + '小时' : '') + (m ? m + '分钟' : '');
}
/* 实付：单价 × 数量 + 罚金 - 折扣（pages/instrument-log-edit _recalc 同口径，保留两位） */
/* 费用：支持多行明细（改单页可「添加」多条 单价 × 数量）
   l.items = [{unit, qty}]；老记录只有 unit / qty 时按单行处理 */
function lgItemsOf(l){
  return (Array.isArray(l.items) && l.items.length) ? l.items : [{ unit: l.unit, qty: l.qty }];
}
function lgFeeOf(l){
  const base = Math.round(lgItemsOf(l).reduce((s, it) =>
    s + (Number(it.unit) || 0) * (Number(it.qty) || 0), 0) * 100) / 100;
  const total = Math.round((base + l.penalty - l.discount) * 100) / 100;
  return { base, total };
}
function lgFeeLeft(l){
  const parts = lgItemsOf(l).map(it => it.unit + '元 × ' + it.qty);
  return parts.join(' + ') + ' + ' + l.penalty + '(罚金) - ' + l.discount + '(折扣)';
}

   金额 = Σ(单价 × 数量)；实际支付 = 金额 + 罚金 - 折扣 */

  const amounts = leItems.map(it => Math.round(leNum(it.unit) * leNum(it.qty) * 100) / 100);

  const formula = parts.join(' + ') + ' + ' + penalty + '(罚金) - ' + discount + '(折扣) = ';

function ajPad2(n){ return n < 10 ? '0' + n : '' + n; }

/* ── 日历（pages/booking-adjust/index.js _buildCal / onPrevMonth / onNextMonth） ──
   hasBook / hasBan：参考 calendar 组件的 spot 标记（有预约 / 有禁用） */
function ajGenDays(){
  const today = ajTodayDs();
  const firstDay = new Date(ajY, ajM - 1, 1).getDay();
  const total = new Date(ajY, ajM, 0).getDate();
  const days = [];
  for(let i=0;i<firstDay;i++) days.push({ id:'blank'+i, blank:true, d:0 });
  for(let d=1; d<=total; d++){
    const ds = ajDsOf(ajY, ajM, d);
    days.push({
      id:ds, d, ds, td: ds === today, dis: ds < today, sel: ds === ajDs,
      hasBook: AJ_LIST.some(b => b.beginDate === ds),
      hasBan: !!(ajDisable[ds] && ajDisable[ds].length)
    });
  }
  while(days.length % 7) days.push({ id:'pad'+days.length, blank:true, d:0 });
  return days;
}
function ajCanPrev(){ const t = new Date(); return ajIndex(ajY, ajM) > ajIndex(t.getFullYear(), t.getMonth() + 1); }
function ajCanNext(){ const t = new Date(); return ajIndex(ajY, ajM) < ajIndex(t.getFullYear(), t.getMonth() + 1) + 12; }
function ajShiftMonth(d){
  if(d < 0 && !ajCanPrev()) return;
  if(d > 0 && !ajCanNext()) return;
  const idx = ajIndex(ajY, ajM) + d;
  ajY = Math.floor(idx / 12); ajM = (idx % 12) + 1;

}
function ajPickDate(ds){

/* ── 时段表（pages/booking-adjust/index.js _baseState / _buildSlots / onCell） ── */
/* 基础状态：今天已过去的档位 → 禁用；模拟他人已约 09:00-09:30 / 14:00-14:30 / 16:00-16:15 → 占用 */
function ajBaseState(ds, i){
  const h = Math.floor(i / 4), q = i % 4;
  if(ds === ajTodayDs()){
    const t = new Date();
    if(i < t.getHours() * 4 + Math.floor(t.getMinutes() / 15)) return 'off';
  }
  if(h === 9 && q < 2) return 'occ';
  if(h === 14 && q < 2) return 'occ';
  if(h === 16 && q < 1) return 'occ';
  return 'idle';
}
function ajBuildSlots(){
  const ban = ajBanFlags(ajDs);
  const base = [];
  for(let i=0;i<AJ_CELLS;i++) base.push(ban[i] ? 'off' : ajBaseState(ajDs, i));
  ajBase = base;

/* 点档位：占用/禁用给出提示；点已选区间 → 清空重选；点空闲档 → 从该档起自动选 1 小时 */
function ajTap(i){
  const st = ajBase[i];
  if(st === 'occ'){ toast('该时段已被占用'); return; }
  if(st === 'off'){ toast('该时段不可预约'); return; }
  if(ajStart >= 0 && ajEnd >= ajStart && i >= ajStart && i <= ajEnd){ ajClearSel(); ajRender(); return; }
  let end = i + AJ_QUADS - 1;
  if(end > AJ_CELLS - 1) end = AJ_CELLS - 1;
  for(let k=i; k<=end; k++){
    if(ajBase[k] !== 'idle'){ toast('所选区间含占用时段，请重新选择'); return; }
  }
  ajStart = i; ajEnd = end; ajRender();
}

function ajAddDisable(){

/* ============================================================
   仪器预约（pages/instrument-book）→ 复刻真实小程序预约页
   ============================================================ */
/* 时长规则展示：接口未提供 / 0 → 渲染「不限」（instrument-book：空值不做默认值兜底） */
function bkRuleCell(v, label, cls){
  const n = Number(v);
  const ok = !(v == null || v === '' || isNaN(n) || n <= 0);
  return `<div class="dur-cell ${cls||''}"><span class="n">${ok ? n : '不限'}</span>`
    + (ok ? '<span class="u">分钟</span>' : '') + `<span class="l">${label}</span></div>`;
}
/* 价格类别：小程序按用户身份取 所内 / 所外 / 院外（instrument-book priceCat），演示取「所内」 */
const BK_PRICE_CAT = '所内';
/* 可预约展望期：今天起 30 天（instrument-book MAX_AHEAD = 30） */
const BK_MAX_AHEAD = 30;
const BK_STEP = 15, BK_DAY = 1440, BK_CELLS = 96; // 24h × 15min 连续档位：00:15 → 24:00
let bkIt = null, bkY = 0, bkM = 0, bkSel = '', bkMode = 'self';
let bkBase = [], bkNext = [], bkStart = -1, bkEnd = -1, bkNextDay = false; // 档位状态 / 起止档序号 / 是否跨天
let bkPurpose = '', bkContent = '', bkRemark = ''; // 测试信息（选填）
function bkPad2(n){ return n < 10 ? '0' + n : '' + n; }
function bkToday(){ const d = new Date(); return { y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate(), h:d.getHours() }; }
function bkDs(y,m,d){ return y + '-' + bkPad2(m) + '-' + bkPad2(d); }
function bkYuan(s){ return parseInt(String(s).replace(/[^\d]/g,''),10) || 0; }
function bkRnd(seed){
  let h = 0;
  for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  return function(){ h ^= h<<13; h >>>= 0; h ^= h>>17; h ^= h<<5; h >>>= 0; return (h%1000)/1000; };
}
function bkDateLabel(ds){
  const p = ds.split('-').map(Number);
  const w = new Date(p[0], p[1]-1, p[2]).getDay();
  return p[1] + ' 月 ' + p[2] + ' 日 星期' + '日一二三四五六'.charAt(w);
}
function bkRuleOf(){ return bkIt.bookRule || { min:60, rec:120, max:480, closedHours:[] }; }
function bkIndex(y,m){ return y*12 + (m-1); }
function bkGenDays(){
  const t = bkToday();
  const todayDs = bkDs(t.y, t.m, t.d);
  const firstDow = new Date(bkY, bkM-1, 1).getDay();
  const dim = new Date(bkY, bkM, 0).getDate();
  const days = [];
  for(let i=0;i<firstDow;i++) days.push({ d:0, blank:true });
  for(let d=1; d<=dim; d++){
    const ds = bkDs(bkY, bkM, d);
    days.push({ d, ds, dis: ds < todayDs, sel: ds === bkSel, td: ds === todayDs });
  }
  while(days.length % 7) days.push({ d:0, blank:true });
  return days;
}
function bkNextDs(ds){
  const p = ds.split('-').map(Number);
  const d = new Date(p[0], p[1]-1, p[2]+1);
  return d.getFullYear() + '-' + bkPad2(d.getMonth()+1) + '-' + bkPad2(d.getDate());
}
function bkTxt(b){ const v = b * BK_STEP; return bkPad2(Math.floor(v/60)) + ':' + bkPad2(v%60); }
function bkDurTxt(min){
  if(!min || min <= 0) return '--';
  const h = Math.floor(min/60), m = min%60;
  if(h >= 24){
    const d = Math.floor(h/24), hh = h%24;
    if(hh && m) return d + ' 天 ' + hh + ' 小时 ' + m + ' 分钟';
    if(hh) return d + ' 天 ' + hh + ' 小时';
    if(m) return d + ' 天 ' + m + ' 分钟';
    return d + ' 天';
  }
  if(h && m) return h + ' 小时 ' + m + ' 分钟';
  if(h) return h + ' 小时';
  return m + ' 分钟';
}
function bkGenCells(ds){
  const t = bkToday();
  const isToday = ds === bkDs(t.y, t.m, t.d);
  const nowMin = t.h*60 + new Date().getMinutes();
  const closed = bkRuleOf().closedHours || [];
  const arr = [];
  for(let i=0;i<BK_CELLS;i++){
    const mins = (i+1)*BK_STEP;
    let st = 'idle';
    if(closed.some(ch => mins > ch*60 && mins <= (ch+1)*60)) st = 'off';        // 维护整点段
    else if(isToday && mins <= nowMin) st = 'off';                                // 今日已过
    arr.push({ i, mins, txt: bkTxt(i+1), st });
  }
  const rnd = bkRnd('q15-' + bkIt.id + '-' + ds);
  const nRuns = 2 + Math.floor(rnd()*3);
  let placed = 0, guard = 0;
  while(placed < nRuns && guard++ < 120){
    const len = 2 + Math.floor(rnd()*7); // 30~120 分钟
    const s = Math.floor(rnd()*BK_CELLS);
    if(s + len > BK_CELLS) continue;
    const seg = arr.slice(s, s+len);
    if(seg.some(x => x.st !== 'idle')) continue;
    for(let k=s;k<s+len;k++) arr[k].st = 'occ';
    placed++;
  }
  return arr;
}
function bkLoadCells(){ bkBase = bkGenCells(bkSel); }
function bkMark(){
  if(bkStart < 0 || bkEnd < bkStart) return;
  bkBase.forEach(s=>{
    if(s.st === 'occ' || s.st === 'off') return;
    s.st = (s.i >= bkStart && s.i <= bkEnd) ? 'sel' : 'idle';
  });
}
function bkReset(){ bkStart = -1; bkEnd = -1; bkNextDay = false; }
function bkClear(){ bkReset(); bkRender(); }
/* 每次进入预约页全新初始化（复刻 v2 onLoad：回到今天、清空已选与输入） */
function bkInit(it){
  const t = new Date();
  bkY = t.getFullYear(); bkM = t.getMonth() + 1;
  bkSel = bkDs(bkY, bkM, t.getDate());

/* v2 交互：进入默认选「当前时间+5 分钟 → 顺延 1 小时」；找不到连续空闲 1h 则不选 */
function bkAutoSel(){
  if(bkStart >= 0 && bkEnd >= bkStart) return;
  const t = bkToday();
  const nowMin = t.h*60 + new Date().getMinutes();
  let s = Math.ceil((nowMin + 5) / BK_STEP);
  if(s < 0) s = 0;
  for(let i=s; i + 3 < BK_CELLS; i++){
    let ok = true;
    for(let k=i; k<=i+3; k++){ if(bkState(k) !== 'idle'){ ok = false; break; } }
    if(ok){ bkStart = i; bkEnd = i + 3; bkNextDay = false; bkMark(); return; }
  }
}
/* 「已选时间」时刻微调：开始 → 整窗顺延 +15 分钟；结束 → 追加 +15 分钟 */
function bkShiftStart(){
  if(bkStart < 0 || bkEnd < bkStart){ toast('请先在时段表选择开始时间'); return; }
  const nb = bkStart + 1, ne = bkEnd + 1;
  if(ne > BK_CELLS - 1){ toast('已达当日可约边界，请选择更早的开始时间'); return; }
  if(bkState(ne) !== 'idle'){ toast('顺延档位不可约，请点击时段表重新选择'); return; }
  bkStart = nb; bkEnd = ne; bkMark(); bkRender();
}
function bkShiftEnd(){
  if(bkStart < 0 || bkEnd < bkStart){ toast('请先在时段表选择开始时间'); return; }
  const rule = bkRuleOf();
  if(bkEnd + 1 > BK_CELLS - 1){ toast('已达当日结束'); return; }
  if(rule.max && (bkEnd + 2 - bkStart) * BK_STEP > rule.max){ toast('超出最大时长（最多 ' + rule.max + ' 分钟）'); return; }
  if(bkState(bkEnd + 1) !== 'idle'){ toast('下一档不可约（占用/维护）'); return; }
  bkEnd = bkEnd + 1; bkMark(); bkRender();
}
function bkPickDate(ds){
  const t = bkToday();
  if(ds < bkDs(t.y, t.m, t.d)){ toast('只能选择今天及以后的日期'); return; }
  bkSel = ds;
  bkReset();
  bkRender();
}
function bkShift(d){
  const t = bkToday();
  const minIdx = bkIndex(t.y, t.m), maxIdx = minIdx + 24;
  const idx = bkIndex(bkY, bkM) + d;

/* ============================================================
   预约详情（复刻 pages/booking-detail）→ 由「我的预约」卡片点入
   ============================================================ */
/* 详情状态标签：对齐 utils/bookingStatus.js 的 DETAIL_TAG（bd-status--*） */
const BD_TAG = {
  pending:  ['待审核','bd-status--warn'],
  approved: ['已通过','bd-status--ok'],
  active:   ['已上机','bd-status--ok'],
  cancelled:['已取消','bd-status--gray'],
  rejected: ['已拒绝','bd-status--err'],
  closed:   ['已关闭','bd-status--gray'],
  noShow:   ['爽约','bd-status--gray']
};
let bdLoading = false;
/* 详情的两个来源：
   ① 我的预约（mbList）── 卡片整体点击进入
   ② 预约审批列表（BA_LIST）── 点「查看详情」进入，params.from = 'bapproval' */
function bdFromMine(id){
  const b = mbList().find(x=>x.id === id);
  if(!b) return null;
  const st = BD_TAG[mbKey(b.st)] || ['未知','bd-status--gray'];
  const endDay = b.endDateLabel ? b.endDateLabel : (b.dateLabel || '');
  return {
    id: b.id, pending: mbKey(b.st) === 'pending',
    statusText: st[0], statusCls: st[1], submitTime: b.submitTime || '',
    instId: b.instId, instName: b.instName, lab: b.lab || '',
    startText: (b.dateLabel || '') + ' ' + (b.startText || ''),
    finishText: endDay + ' ' + (b.endText || ''),
    durText: b.durText || '', modeName: b.modeName || '--',
    amountText: b.costText || '--',
    memos: [['测试目的', b.purpose], ['测试内容', b.contentQty], ['备注', b.remark], ['补充信息', b.memo4]]
  };
}
function bdFromApproval(id){
  const x = BA_LIST.find(y=>y.id === id);
  if(!x) return null;
  const st = BA_STATUS[x.status] || BA_STATUS.pending;
  const it = INSTRUMENTS.find(i=>i.name === x.instName) || {};
  return {
    id: x.id, pending: x.status === 'pending',
    statusText: st.text, statusCls: st.cls, submitTime: x.applyTime,
    instId: it.id, instName: x.instName, lab: x.lab,
    startText: x.beginText, finishText: x.finishText,
    durText: lgDurText(x.beginText, x.finishText),
    modeName: x.mode === 2 ? '委托' : '自助',
    amountText: (x.base + x.penalty - x.discount) + ' 元',
    memos: [['测试目的', x.memo1], ['测试内容', x.memo2], ['备注', x.memo3]]
  };
}
function bdModel(){
  const p = params['bdetail'] || {};
  return (p.from === 'bapproval' ? bdFromApproval(p.id) : bdFromMine(p.id));
}
function bdRow(k, v, cls){ return `<div class="bd-row${cls?' '+cls:''}"><span class="bd-row-k">${k}</span><span class="bd-row-v">${v}</span></div>`; }
function bdCardHtml(title, rowsHtml, tip){
  return `<div class="bd-card">
    <div class="bd-card-t"><span class="bd-dot"></span><span class="bd-card-tt">${title}</span>${tip?`<span class="bd-card-tip">${tip}</span>`:''}</div>
    ${rowsHtml}
  </div>`;
}
function bdBodyHtml(){
  const b = bdModel();
  if(bdLoading) return '<div class="bd-loading"><span class="bd-load-spin"></span><span class="bd-load-t">正在加载预约详情…</span></div>';
  if(!b) return '<div class="bd-empty"><span class="bd-empty-ic">📭</span><span class="bd-empty-t">未找到该预约记录</span></div>';
  const it = INSTRUMENTS.find(i=>i.id === Number(b.instId)) || {};

      <span class="bd-fee-cell bd-fee-cell--money">${esc(r.entrust||'¥0')}</span></div>`).join('');
  const memos = b.memos.filter(m=>m[1]);

    : '<div class="bd-row"><span class="bd-row-v bd-row-v--muted">暂无测试信息</span></div>';
  /* 待审核 → 显示「预约时间调整」（pages/booking-detail/index.wxml onAdjustTime） */

    ? '<div class="bd-adjust" onclick="bdAdjust()">预约时间调整</div>'
    : '';
  return `<div class="bd-page">
    <div class="bd-head">
      <div class="bd-head-row">
        <span class="bd-status ${b.statusCls}">${esc(b.statusText)}</span>
        ${b.submitTime ? `<span class="bd-head-sub">提交于 ${esc(b.submitTime)}</span>` : ''}
      </div>
    </div>
    ${bdCardHtml('预约信息',
      bdRow('仪器', esc(b.instName || '--')) +
      bdRow('实验室', '🧪 ' + esc(b.lab || '--')) +
      bdRow('开始时间', esc(b.startText || '--')) +
      bdRow('结束时间', esc(b.finishText || '--')) +
      (b.durText ? bdRow('时长', esc(b.durText)) : '') +
      bdRow('计费方式', esc(b.modeName || '--')) +
      bdRow('小时单价', esc(unit)) +
      `<div class="bd-row"><span class="bd-row-k">总费用</span><span class="bd-row-v bd-row-v--em">${esc(b.amountText || '--')}</span></div>` +
      adjustHtml)}
    ${bdCardHtml('测试信息', memoHtml)}
    ${bdCardHtml('收费标准',
      `<div class="bd-fee"><div class="bd-fee-row bd-fee-row--head">
        <span class="bd-fee-cell bd-fee-cell--cat">类别</span>
        <span class="bd-fee-cell bd-fee-cell--money">自助价</span>
        <span class="bd-fee-cell bd-fee-cell--money">委托价</span></div>${feeRows}</div>
       <div class="bd-tip">自助操作费用较低；委托测试按委托价收取，结果数据由平台统一交付。</div>`,
      '单位：元 / 小时')}
    ${bdCardHtml('管理员信息',
      bdRow('管理员', esc(it.manager || '--')) +
      (it.contactPhone
        ? `<div class="bd-row"><span class="bd-row-k">联系电话</span><span class="bd-row-v bd-phone" onclick="bdCall('${esc(it.contactPhone)}')">📞 ${esc(it.contactPhone)}</span></div>`
        : bdRow('联系电话', '<span class="bd-row-v--muted">--</span>')))}
    ${bdCardHtml('资产与位置',
      bdRow('地址', '📍 ' + esc(it.address || '--')) +
      bdRow('仪器所属', esc(it.ownership || '--')) +
      bdRow('SN 编号', esc(it.sn || '--')) +
      bdRow('固定资产编号', esc(it.assetNo || '--')) +
      bdRow('所资产编号', esc(it.instAssetNo || '--')) +
      bdRow('型号', esc(it.model || '--')))}
    <div class="bd-bottom"></div>
  </div>`;
}

/* ============================================================
   我的（复刻 components/profile/profile）
   ============================================================ */
function uploadState(){
  const list = store('admissionUpload');
  const docs = list && list.length ? list : null;
  if(!docs) return {done:0, total:UPLOAD_DOCS.filter(d=>d.required).length};
  const req = docs.filter(d=>d.required);
  return {done: req.filter(d=>d.photos && d.photos.length>0).length, total: req.length};
}
function examSaved(){ return store('admissionExam') || null; }
function examPassed(){ const e = examSaved(); return !!(e && e.passed); }
function pstepState(i){
  const s = stepStore() || 0;
  if(s === 0) return i === 0 ? 'active' : 'pending';
  if(s === 1){
    const all = uploadState().done >= uploadState().total;
    const pass = examPassed();
    if(!pass || !all) return i===0 ? 'done' : (i===1 ? 'active' : 'pending');
    return i<2 ? 'done' : (i===2 ? 'active' : 'pending');
  }
  if(s === 2) return i<2 ? 'done' : (i===2 ? 'active' : 'pending');
  return i<3 ? 'done' : (i===3 ? 'active' : 'pending');
}
/* 进度状态文案：对齐 profile.js STATUS_TEXT（step 1-4；原型 stepStore 为 0-3，故 +1 后取值）
   注：小程序还有 STATE_STATUS_TEXT 覆盖「已取消/已驳回」两种特殊态，原型无对应状态，暂不演示 */
const PR_STATUS_TEXT = {
  1: '尚未提交准入申请，请先完成申请登记',
  2: '材料提交中：请上传审批文件并完成安全考试',
  3: '审批文件审核中，预计1-3个工作日',
  4: '已完成平台准入，可预约仪器与工位'
};
function prStatusText(){
  const s = stepStore() || 0;
  return PR_STATUS_TEXT[s + 1] || PR_STATUS_TEXT[1];
}
function prStepsHtml(){
  /* 步骤名对齐 profile.js buildSteps 的 labels（原型旧版写作「安全考试」，小程序为「材料提交」） */
  const labels = ['申请登记','材料提交','审批审核','准入完成'];
  let h = '<div class="pr-steps">';
  for(let i=0;i<4;i++){
    const st = pstepState(i);
    if(i>0) h += `<div class="p-line ${st!=='pending'?'done':''}"></div>`;
    const inner = st==='done' ? '<span style="color:#fff;font-size:12px">✓</span>'
      : st==='active' ? `<span class="psc" style="color:#FF9800;font-size:12px">${i+1}</span>`  // 占位
      : `<span style="color:#bbb;font-size:12px">${i+1}</span>`;
    h += `<div class="pstep"><div class="psc ${st==='done'?'done':st==='active'?'active':'gray'}">${st==='done'?'✓':(i+1)}</div><div class="psl ${st==='done'?'done':st==='active'?'active':''}">${labels[i]}</div></div>`;
  }
  h += '</div>';
  return h;
}
/* 准入徽章：对齐 profile.js BADGE（1 未开始 / 2 材料提交 / 3 审核中 → reviewing，4 已准入 → passed）
   配色对齐 profile.wxss：reviewing #FFF3E0 / #FF9800，passed #E8F5E9 / #4CAF50 */
function prBadgeHtml(){
  const s = (stepStore() || 0) + 1;
  const txt = s >= 4 ? '已准入' : s === 3 ? '审核中' : s === 2 ? '材料提交' : '未开始';
  return s >= 4
    ? `<span class="pr-badge pr-badge--passed">${txt}</span>`
    : `<span class="pr-badge pr-badge--reviewing">${txt}</span>`;
}

      ${ic}

/* 本月考勤统计：按记录里的打卡时间算（复刻 index.js:129-150） */
function wbStats(){
  const r = wbRec() || {};
  const cis = Array.isArray(r.checkIns) ? r.checkIns : [];
  const now = new Date();
  const p = n => String(n).padStart(2,'0');
  const ym = now.getFullYear() + '-' + p(now.getMonth() + 1);
  const set = new Set(cis.filter(c => c && String(c.time || '').indexOf(ym) === 0).map(c => String(c.time).slice(0,10)));
  const total = now.getDate();
  const checked = Math.min(set.size, total);
  return { set, ym, checked, total, rate: total ? Math.round(checked / total * 100) : 0 };
}
function wbBarHtml(){
  const st = wbStats();

  for(let d = 1; d <= 30; d++){

    const ph = on ? (68 + (d * 7) % 30) : (22 + (d * 3) % 16);
    h += `<div class="ck-bar ${on ? 'on' : ''}" style="height:${ph}%"></div>`;
  }
  return h;
}

/* 提交申请：校验（复刻 submitApply）→ 二次确认 → 写入 status=pending */
function wbSubmitApply(){

function wbConfirmSubmit(){
  closeOverlay();
  const f = wbForm;
  const p = n => String(n).padStart(2,'0');
  const d = new Date();
  const record = {
    id: 'wb_' + Date.now(),
    group: f.group,
    startDate: f.startDate,
    endDate: f.endDate,
    reason: String(f.reason).trim(),
    attachments: wbPhotos.map(x => ({ fileName: x.fileName, isFile: !!x.isFile, url: 'demo' })),
    submitTime: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`,

const DUTY_LEADER = '李雅琴';
/* 排班为「今天起连续 7 天」（对齐 GET /api/workstation/duty/myWeek 返回的一周值日表）。
   今天（第 0 天）的成员包含当前用户 USER.name → 对应 duty-admin 的 canCheckIn：
   只有今天的值日人员里有「我」，底部才出现「值日打卡」浮动按钮。 */
const DUTY_PAIRS = [
  [USER.name, '王思远'], ['孙悦','陈晨'], ['周柏然','王思远'],
  ['陈晨','刘晓东'], ['赵鑫磊','孙悦'], ['刘晓东','王思远'], ['陈晨','周柏然']
];
const DUTY_DOW = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
/* signState：今天是否已打卡（对应 duty-admin 从接口读到的 signState=1 → checkedToday） */
let dutySigned = false;
function dutyDays(){
  return DUTY_PAIRS.map((members, off) => {
    const d = new Date(); d.setDate(d.getDate() + off);
    return {
      dow: DUTY_DOW[d.getDay()],
      /* 日期展示同 duty-admin：今天显示「今天」，其余显示 MM/DD */
      dateText: off === 0 ? '今天' : (d.getMonth() + 1) + '/' + String(d.getDate()).padStart(2, '0'),
      members,
      isToday: off === 0,
      signState: (off === 0 && dutySigned) ? 1 : 0
    };
  });
}
function dutyCanCheckIn(){ return dutyDays()[0].members.indexOf(USER.name) >= 0; }
/* 值日打卡：复刻 duty-admin 的 onDutyCheckIn → wx.scanCode → POST /api/workstation/duty/signJson。
   成功后端会置 signState=1，按钮随之变灰显示「今日已打卡」且不可再点 */
function dutyCheckIn(){
  if(dutySigned) return;
  dutySigned = true;
  toast('演示：扫码成功 → /api/workstation/duty/signJson 打卡完成');
  refreshDutyAdmin();
}

function dutyFabHtml(){
  if(!dutyCanCheckIn()) return '';
  return `<div class="da-fab-wrap">
    <div class="da-fab${dutySigned ? ' da-fab--done' : ''}" onclick="dutyCheckIn()">
      <span class="da-fab-icon">${dutySigned ? '✓' : '📷'}</span>

      ['实验内容', f.purpose]

    /* 顶部进度汇总：已填写 N / 共 M 项（全部填完才高亮） */
    const filled = src.filter(r=>isFilled(r[1])).length;
    const rows = src.map(r=>[r[0], isFilled(r[1]) ? r[1] : '未填写', isFilled(r[1])]);

      rows.push(['考试成绩', e.score+' 分', true], ['答对题数', e.correct+' / '+e.total+' 题', true],
        ['考试结果', e.passed?'已通过（≥60 分通过）':'未通过（可重新考试）', e.passed], ['考试时间', e.time||'—', !!e.time]);
    } else {

    if(cur === 1){
      const u = uploadState();

      const eDone = examPassed();
      if(!uDone) act = `<div class="sh-it" onclick="closeSheet();go('upload')"><span style="color:#33ADDE">去上传材料</span></div>`;

      ['预计时长','1-3 个工作日', false],

  }

function regInitials(text){
  const s = String(text == null ? '' : text);
  let out = '';
  for (let i = 0; i < s.length; i++){
    const ch = s[i];
    const code = ch.charCodeAt(0);
    if (code >= 65 && code <= 90){ out += String.fromCharCode(code + 32); continue; }  // A-Z
    if (code >= 97 && code <= 122){ out += ch; continue; }                              // a-z
    if (code >= 48 && code <= 57){ out += ch; continue; }                               // 0-9
    if (code >= 0x4e00 && code <= 0x9fa5){ const l = REG_PY_MAP[ch]; if (l) out += l; } // 汉字
  }
  return out;
}

  if(!regState.form.phone && auth.phone) regState.form.phone = auth.phone;
}

function regSelField(k, label){

  return `<div class="field">

    <div class="f-sel" onclick="regSelShow('${k}')">
      <span class="fs-ph ${v?'fs-has':''}" id="regFs_${k}">${v?esc(v):'请选择'}</span>
      <span class="fs-ar">›</span>
    </div>
  </div>`;
}
function regSelShow(k){
  const meta = REG_SEL_META[k]; if(!meta) return;
  const label = meta[0];
  rpKey = k; rpSrc = meta[1]; rpKw = '';
  sheet(`<div class="rp-hd"><span class="rp-title">请选择${label}</span><span class="rp-cancel" onclick="closeSheet()">取消</span></div>
    <div class="rp-search-wrap"><div class="rp-search"><span class="rp-search-ic">🔍</span><input id="rpKwInput" placeholder="输入名称或拼音首字母" value="" oninput="regSelFilter(this.value)"></div></div>
    <div class="rp-list" id="rpList"></div>`);
  regSelRender();
  const inp = $('rpKwInput'); if(inp) setTimeout(()=>inp.focus(), 30);
}
function regSelFilter(q){ rpKw = q || ''; regSelRender(); }
function regSelRender(){
  const list = $('rpList'); if(!list) return;
  const q = rpKw.trim().toLowerCase();
  const isAlpha = /^[a-z0-9]+$/.test(q);
  const hit = [];
  rpSrc.forEach((o, idx) => {
    if(!q){ hit.push({ o, idx }); return; }
    const hay = (o.searchTxt || '').toLowerCase();
    const initials = o.initials || '';
    if(hay.indexOf(q) >= 0 || (isAlpha && initials.indexOf(q) >= 0)) hit.push({ o, idx });
  });
  list.innerHTML = hit.length
    ? hit.map(x => `<div class="rp-it" onclick="regSelPick(${x.idx})">
        <span class="rp-it-n">${esc(x.o.name)}</span>${x.o.sub ? '<span class="rp-it-s">' + esc(x.o.sub) + '</span>' : ''}
      </div>`).join('')
    : '<div class="rp-it-empty">未找到匹配项，可尝试其它关键词</div>';
}
function regSelPick(i){
  const o = rpSrc[i]; if(!o){ closeSheet(); return; }
  const f = regState.form;
  closeSheet();
  if(rpKey === 'supervisor'){
    f.supervisor = o.name;
    f.teacherId = o.id || '';
    if(!f.superphone && o.phone) f.superphone = o.phone;
    if(!f.group && o.group){ f.group = o.group; f.teamId = regTeamId(o.group); regSelRefresh('group'); }
    if(!f.dept && o.dept){ f.dept = o.dept; f.deptId = regDeptId(o.dept); regSelRefresh('dept'); }
    const sp = $('regSuperphone'); if(sp) sp.value = f.superphone || '';
  } else if(rpKey === 'group'){
    f.group = o.name;
    f.teamId = o.id || '';
    if(!f.dept && o.dept){ f.dept = o.dept; f.deptId = regDeptId(o.dept); regSelRefresh('dept'); }
  } else if(rpKey === 'dept'){
    f.dept = o.name;
    f.deptId = o.id || '';
  } else {
    f[rpKey] = o.name;
  }
  regSelRefresh(rpKey);
}
function regSelRefresh(k){
  const el = $('regFs_' + k); if(!el) return;
  const v = regState.form[k] || '';
  el.textContent = v || '请选择';
  el.classList.toggle('fs-has', !!v);

function regSubmit(){
  if(!regState.agreed){ toast('请先勾选同意声明'); return; }
  const inside = regState.identity === 'inside';
  const f = regState.form;
  if(inside && !f.scope){ toast('请选择「人员类型」（所内/所外）'); return; }
  const required = [
    ['name','姓名'], ['idNo','学号/工号'], ['phone','手机号'],
    ['supervisor','导师姓名'], ['superphone','导师手机号'], ['group','课题组'],
    [inside?'dept':'org', inside?'部门':'所在单位'], ['purpose','实验内容']
  ];
  for(const [k,label] of required){
    if(!f[k] || !String(f[k]).trim()){ toast('请填写「'+label+'」'); return; }
  }
  if(!/^1\d{10}$/.test(String(f.phone).trim())){ toast('请输入正确的手机号'); return; }
  modal({
    icon:'📝', title:'确认提交',
    sub:'请确认所填信息真实有效，提交后进入「材料提交」环节：上传审批文件、参加安全考试，通过后提交审核。',
    btns:[
      {t:'再检查一下', c:'btn-gray', fn:'closeOverlay()'},
      {t:'确认提交', c:'btn-grad', fn:'regConfirmSubmit()'}
    ]
  });
}
/* 提交后端的登记字段（字段名对齐接口约定） */
function regBuildPayload(){
  const f = regState.form, inside = regState.identity === 'inside';
  return {
    open_id: auth.openId || store('lab_openid') || '',    // 授权登录返回并缓存的 openid（后端字段名为 open_id）
    type: inside ? 1 : 2,                                // 1.院内 2.院外
    name: (f.name||'').trim(),                           // 姓名
    sex: (f.sex === 0 || f.sex === 1) ? f.sex : '',      // 性别：0.男 1.女
    user_no: (f.idNo||'').trim(),                        // 学号/工号
    phone: (f.phone||'').trim(),                         // 手机号
    dept_id: f.deptId || '',                             // 部门ID
    dept_name: f.dept || '',                             // 部门名称
    user_type: inside ? (f.scope === '所外' ? 2 : 1) : 2,// 人员类型：1.所内 2.所外
    email: (f.email||'').trim(),                         // 邮箱
    teacher_name: f.supervisor || '',                    // 导师姓名
    teacher_id: f.teacherId || '',                       // 导师ID
    teacher_phone: (f.superphone||'').trim(),            // 导师手机号
    team_id: f.teamId || '',                             // 课题组ID
    team_name: f.group || '',                            // 课题组
    profession: f.major || '',                           // 专业
    company: f.org || '',                                // 所在单位
    project_name: f.project || '',                       // 合作项目
    research_direction: f.purpose || ''                  // 实验内容
  };
}
/* 申请登记接口：POST /api/register（JSON）。对应小程序 utils/api.js 的 registerAdmission */
const REG_API = 'http://127.0.0.1:8114/api/register';
function regSubmitApi(payload){
  return fetch(REG_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(r => r.json()).then(body => {
    const code = (body && body.code !== undefined) ? body.code : 0;
    if(String(code) !== '0') throw new Error((body && (body.msg || body.message)) || '登记提交失败');
    return (body && body.data !== undefined) ? body.data : body;
  });
}
function regAfterSubmit(payload, res){
  store('admissionRegister', {
    identity: regState.identity,
    agreed: regState.agreed,
    form: regState.form,
    payload: payload,
    res: res || null,
    submitTime: nowFmt()
  });
  setStep(1);
  toast('登记成功');
  setTimeout(()=>go('onb'), 350);
}
function regConfirmSubmit(){
  closeOverlay();
  const payload = regBuildPayload();
  console.log('[register] POST /api/register payload =', JSON.stringify(payload));
  regSubmitApi(payload)
    .then(data => { console.log('[register] /api/register 返回：', data); regAfterSubmit(payload, data); })
    /* 原型为纯静态页：接口不可用时回退为本地模拟成功，保证演示流程可走通 */
    .catch(err => { console.warn('[register] /api/register 调用失败，本地模拟成功：', err); regAfterSubmit(payload); });
}

let upDocs = [];
function makeShot(docId, n){
  const c = THUMB_COLORS[(docId*3 + n) % THUMB_COLORS.length];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='144' height='144'>
    <rect width='144' height='144' fill='${c}'/>
    <rect x='7' y='7' width='130' height='130' fill='none' stroke='rgba(10,123,184,.3)' stroke-width='2' stroke-dasharray='6 5'/>
    <text x='72' y='72' font-size='22' text-anchor='middle' fill='rgba(10,123,184,.7)'>📄</text>
    <text x='72' y='100' font-size='13' text-anchor='middle' fill='rgba(14,28,38,.55)'>第${n}张</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function upDocBlockHtml(d){
  const max = 3;
  const photos = (d.photos||[]).map((p,i)=>`
    <div class="upload-ph">
      <img src="${p}" style="width:100%;height:100%;object-fit:cover" alt="">
      <span class="upload-ph-del" onclick="upRemove(${d.id},${i})">✕</span>
    </div>`).join('');
  return `<div class="upload-doc">
    <div class="upload-doc-hd">
      <div class="upload-doc-ic">📄</div>
      <div class="upload-doc-m">
        <div class="upload-doc-nr">
          <span class="upload-doc-n">${esc(d.name)}</span>
          ${d.required?'<span class="upload-doc-req">必填</span>':'<span class="upload-doc-opt">选填</span>'}
        </div>
        <span class="upload-doc-d">${esc(d.desc)}</span>
      </div>
      <span class="upload-doc-cnt ${photos?'has':''}">${(d.photos||[]).length}/${max}</span>
    </div>
    <div class="upload-photos">
      ${photos}
      ${(d.photos||[]).length < max ? `<div class="upload-add" onclick="upAdd(${d.id})">
        <span class="plus">＋</span><span class="upload-add-t">添加照片</span>
      </div>` : ''}
    </div>
  </div>`;
}
function uploadBodyHtml(){
  const tpls = TEMPLATES.map((t,i)=>`
    <div class="upload-tpl-item" onclick="upDownload(${i})">
      <div class="upload-tpl-file">
        <div class="upload-tpl-ic">📄</div>
        <div class="upload-tpl-meta">
          <span class="upload-tpl-name">${esc(t.name)}</span>
          <span class="upload-tpl-fmt">${esc(t.fmt)}</span>
        </div>
      </div>
      <span class="upload-tpl-btn">⬇ 下载</span>
    </div>`).join('');
  return `<div id="upBody">
    <div class="upload-tip"><span class="upload-tip-text">ℹ️ 请拍照或从相册选择，每份文件可上传最多 3 张</span></div>
    <div class="upload-tpl">
      <div class="upload-tpl-title-row"><span>⬇</span><span class="upload-tpl-title">模板下载</span></div>
      <span class="upload-tpl-sub">下载空白模板，打印填写并完成签字后拍照上传</span>
      ${tpls}
    </div>
    ${upDocs.map(upDocBlockHtml).join('')}
    <div class="ob-footer">
      <button class="btn btn-main btn-block" style="border-radius:21px;height:42px;margin-bottom:10px" onclick="upSubmit()">保存并返回</button>
      <button class="btn btn-sec btn-block" style="height:40px" onclick="upDraft()">暂存</button>
    </div>
    <div style="height:20px"></div>
  </div>`;
}
function buildUpload(){
  const saved = store('admissionUpload');
  upDocs = saved && saved.length ? saved : JSON.parse(JSON.stringify(UPLOAD_DOCS));
  insertScreen('upload', navHtml('材料上传','back()') + '<div class="ob-wrap">' + uploadBodyHtml() + '</div>');
}
function refreshUpload(){
  const el = $('scr-upload'); if(!el) return;
  const saved = store('admissionUpload');
  if(saved && saved.length) upDocs = saved;
  el.innerHTML = navHtml('材料上传','back()') + '<div class="ob-wrap">' + uploadBodyHtml() + '</div>';
}
function upPersist(){ store('admissionUpload', upDocs); }
function upDownload(i){
  const t = TEMPLATES[i]; if(t) toast('已开始下载模板：' + t.name + '.' + t.fmt);
}
function upAdd(id){
  const d = upDocs.find(x=>x.id===id); if(!d) return;
  if((d.photos||[]).length >= 3){ toast('最多上传 3 张'); return; }
  sheet(`<div class="sh-it" onclick="upDoAdd(${id});closeSheet()">📷 拍照上传（模拟）</div>
    <div class="sh-it" onclick="upDoAdd(${id});closeSheet()">🖼️ 从相册选择（模拟）</div>
    <div class="sh-it sh-cancel" onclick="closeSheet()">取消</div>`);
}
function upDoAdd(id){
  const d = upDocs.find(x=>x.id===id); if(!d) return;
  d.photos = d.photos || [];
  d.photos.push(makeShot(id, d.photos.length + 1));
  upPersist();
  const body = $('upBody'); if(body) body.outerHTML = uploadBodyHtml();
}
function upRemove(id, idx){
  const d = upDocs.find(x=>x.id===id); if(!d) return;
  d.photos.splice(idx, 1);
  upPersist();
  const body = $('upBody'); if(body) body.outerHTML = uploadBodyHtml();
}
function upSubmit(){
  upPersist();
  toast('已保存并返回');
  setTimeout(()=>back(), 300);
}
function upDraft(){
  upPersist();
  toast('已暂存');
  setTimeout(()=>back(), 300);
}

let exState = null;
function exFmt(sec){
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}
function buildExam(){
  insertScreen('exam', `
    <div class="ex-wrap">

          <span style="color:#fff;font-size:18px;cursor:pointer" onclick="confirmExitExam()">✕</span>
        </div>
      </div>
      <div class="ex-prog-bar"><div class="ex-prog-fill" id="exFill" style="width:20%"></div></div>
      <div style="flex:1;overflow-y:auto" id="exQ"></div>
      <div class="ex-nav" id="exNav"></div>
    </div>`);
  exStart();
}
function refreshExam(){ exStart(); }
function exStart(){
  if(timerHandle) clearInterval(timerHandle);
  exState = { index:0, total:QUESTIONS.length, timer:1800, answers:{} };
  const el = $('scr-exam');
  if(!el) return;
  const t = $('exTimer'); if(t){ t.textContent='30:00'; t.classList.remove('warning'); }
  exRender();
  timerHandle = setInterval(()=>{
    exState.timer--;
    if(exState.timer <= 0){ clearInterval(timerHandle); exGrade(); return; }
    const t2 = $('exTimer');
    if(t2){ t2.textContent = exFmt(exState.timer); t2.classList.toggle('warning', exState.timer < 300); }
  }, 1000);
}
function exRender(){
  const q = QUESTIONS[exState.index];
  const optLetters = ['A','B','C','D'];
  const answered = Object.keys(exState.answers).length;
  const qHtml = `
    <div class="q-card">
      <div class="q-meta">
        <span class="qtype-tag">单选题</span>
        <span class="qscore">${exState.index+1}/${exState.total} · 已答 ${answered} 题</span>
      </div>
      <span class="q-text">${q.q}</span>
      ${q.options.map((txt, i)=>`
        <div class="opt ${exState.answers[exState.index]===i?'selected':''}" onclick="exPick(${i})">
          <span class="opt-c">${optLetters[i]}</span>
          <span class="opt-t">${txt}</span>
        </div>`).join('')}
    </div>`;
  /* 复刻 exam.wxml：index>0 显示「上一题」；到达末题时将「下一题」替换为「交卷」 */
  const navBtns =
    (exState.index>0?`<button class="btn btn-sec" style="flex:1" onclick="exPrev()">上一题</button>`:'') +
    (exState.index < exState.total-1
      ? `<button class="btn btn-main" style="flex:1" onclick="exNext()">下一题</button>`
      : `<button class="btn btn-main" style="flex:1" onclick="exSubmit()">交卷</button>`);
  const qb = $('exQ'); if(qb) qb.innerHTML = qHtml;
  const n = $('exNav'); if(n) n.innerHTML = navBtns; /* 仅替换容器内容以保留 #exNav，供后续翻题持续更新 */
  const fill = $('exFill'); if(fill) fill.style.width = Math.round((exState.index+1)/exState.total*100) + '%';
}
function exPick(i){
  exState.answers[exState.index] = i;
  exRender();
}
function exNext(){ if(exState.index < exState.total-1){ exState.index++; exRender(); } }
function exPrev(){ if(exState.index > 0){ exState.index--; exRender(); } }
function exSubmit(){
  const unanswered = exState.total - Object.keys(exState.answers).length;
  if(unanswered > 0){
    modal({
      icon:'📝', title:'确认交卷',
      sub:'还有 '+unanswered+' 题未作答，是否确认交卷？',
      btns:[
        {t:'继续答题', c:'btn-gray', fn:'closeOverlay()'},
        {t:'确认交卷', c:'btn-grad', fn:'exGrade()'}
      ]
    });
    return;
  }
  exGrade();
}
function exGrade(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
  closeOverlay();
  let score = 0, correct = 0;
  QUESTIONS.forEach((q,i)=>{ if(exState.answers[i] === q.answer){ score += 20; correct++; } });
  const record = { score, correct, total: exState.total, passed: score>=60, time: nowFmt() };
  store('admissionExam', record);
  const fromTraining = !!(params['exam'] && params['exam'].from === 'training');
  if(fromTraining) store('safetyTrainingExam', record); /* 复刻 exam.js：培训入口同场成绩同时写入培训记录 */
  if(fromTraining){
    toast(record.passed ? '考试通过 · ' + score + ' 分' : '未通过 · ' + score + ' 分');
    setTimeout(()=>back(), 350);
    return;
  }
  go('admok', { type:'exam', score, correct, total:exState.total, passed: record.passed });
}
